# The handbook. One card per term.
#
# Every card feeds four places: the knowledge base the agent searches, the
# Learn tab, docs/glossary.md, and the step inspector (through `kinds`, the
# event kinds a card explains). tests/test_handbook.py checks that every card
# names a real file and a real diagram box, and that every event kind the
# engine can emit is explained by exactly one card.
#
# Fields: id, term, aliases, pillar, node (diagram box), kinds, one_liner,
# explain, why, tradeoff, file, try (a prompt that shows it live),
# question / answer (how it comes up in an interview).

# =============================================================== HARNESS

[[concept]]
id = "agent"
term = "Agent"
aliases = ["AI agent", "agentic system", "agent vs workflow"]
pillar = "harness"
node = "model"
kinds = []
one_liner = "A system where a model decides, in a loop, which actions to take to reach a goal."
explain = "An agent is a model placed in a loop with tools: it reads the situation, picks an action, sees the result and repeats until it judges the task done. The defining property is that the model, not the programmer, controls the sequence of steps. A workflow is the opposite: the steps are fixed in code and the model fills in each one."
why = "Some tasks cannot be scripted in advance because the next step depends on what the last step found. An agent handles that open-endedness."
tradeoff = "Autonomy costs predictability, latency and money. If you can draw the steps as a flowchart, build the workflow: it is cheaper, faster and easier to test. Reach for an agent only when the path really is unknown."
file = "loopwright/loop.py"
try = "What is an agent?"
question = "When would you build a workflow instead of an agent?"
answer = "When the steps are known ahead of time. A workflow is deterministic, cheap to run and easy to evaluate step by step. I use an agent only where the path depends on intermediate results, and even then I keep the fixed parts (validation, formatting, approvals) in code around it."

[[concept]]
id = "harness"
term = "Harness"
aliases = ["agent harness", "scaffold", "scaffolding", "agent runtime"]
pillar = "harness"
node = "context"
kinds = ["gateway.receive", "reply.send"]
one_liner = "The ordinary code around a model that turns it into an agent."
explain = "A model maps text to text. It has no memory, no tools, no budget and no way to stop itself. The harness is everything that supplies those: it assembles the prompt, runs the loop, executes tools, enforces permissions and limits, stores memory, and records what happened. Two agents on the same model differ almost entirely in their harness."
why = "Without a harness a model can only chat. With a weak one it can act, but it forgets, loops forever, overspends or does something it should not."
tradeoff = "Every mechanism in the harness is code you own, test and maintain. A heavy harness can also fight a capable model, so add a mechanism only for a failure you have actually seen."
file = "loopwright/harness.py"
try = "What is a harness?"
question = "What is an agent harness, and why does it matter more than the model?"
answer = "It is the code around the model: context assembly, the loop, the tool gate, memory, guardrails, tracing. It matters because the model is a commodity you can swap, while reliability, safety and cost are properties of the harness. When an agent fails in production the fix is usually in the harness: a missing stop condition, a bloated context, an unguarded tool."

[[concept]]
id = "gateway"
term = "Gateway"
aliases = ["channel", "interface", "front door"]
pillar = "harness"
node = "gateway"
kinds = []
one_liner = "The door a message comes in by: a terminal, a web page, a chat app, another agent."
explain = "A gateway adapts one channel to the harness: it receives a message, starts a turn and delivers the reply back the same way. Loopwright has several (terminal, web cockpit, MCP server, Telegram, Discord, Slack, WhatsApp, and the scheduler, whose 'user' is a clock) and all of them call the same run_turn. Nothing about the agent's behaviour lives in a gateway."
why = "Keeping channels thin means one agent behaves identically everywhere, and adding Slack or voice later is an adapter, not a rewrite."
tradeoff = "Channels differ in what they can show (buttons, streaming, approval prompts). A thin gateway pushes those differences into small per-channel code, such as how an approval is asked."
file = "loopwright/server.py"
try = "hi"
question = "How would you add a Slack interface to an existing agent?"
answer = "As a gateway: an adapter that turns a Slack event into a call to the same turn function and posts the reply back. Session id maps to the thread, approvals become interactive buttons. No agent logic changes, and the same evals keep covering it."

[[concept]]
id = "turn"
term = "Turn"
aliases = ["agent run", "episode", "trajectory", "session"]
pillar = "harness"
node = "reply"
kinds = []
one_liner = "One user message and everything the agent does until it replies."
explain = "A turn begins when a message arrives and ends when the reply is sent. Inside it the loop may call the model and tools many times; the ordered record of those steps is the trajectory. A session is a sequence of turns that share working memory."
why = "The turn is the unit you budget, trace, evaluate and bill. Most limits (iterations, tokens, tool calls) are per turn."
tradeoff = "Long-running work does not fit in one synchronous turn. That is when you need checkpoints, background jobs and a way to resume."
file = "loopwright/harness.py"
try = "What is a turn?"
question = "What is the difference between a turn, a trajectory and a session?"
answer = "A turn is one request through to its reply. The trajectory is the ordered list of steps taken inside that turn: model calls, tool calls, results. A session is many turns sharing conversation history. I evaluate trajectories, budget per turn and scope working memory per session."

[[concept]]
id = "checkpointing"
term = "Checkpointing"
aliases = ["durable execution", "resume", "state persistence", "long-running agents"]
pillar = "reliability"
node = "checkpoint"
kinds = ["checkpoint.save", "checkpoint.resume"]
one_liner = "Saving the loop's state after every step so a turn that dies can continue instead of restarting."
explain = "After each round of the loop the full state (prompt, conversation, tool results) is written to the database. If the process crashes, is redeployed or the provider goes down, the turn resumes from the last checkpoint. Tool calls that already ran are in the saved conversation and are not repeated."
why = "Agents run for minutes and call tools with side effects. Restarting from zero wastes the work and, worse, repeats the side effects."
tradeoff = "Checkpoints cost a write per step and force every tool to be safe to re-run (idempotent), because a crash can land between running a tool and saving its result."
file = "loopwright/harness.py"
try = "What is checkpointing?"
question = "An agent crashes halfway through a ten-step task. What should happen?"
answer = "It resumes from the last checkpoint. I persist the conversation state after every step, so completed tool calls are replayed from the record, not re-executed. For the one call that might have been in flight, an idempotency key makes re-running it safe. Without both, a retry either loses work or double-books the meeting."

# =============================================================== LOOP AND ORCHESTRATION

[[concept]]
id = "react-loop"
term = "Agent loop (ReAct)"
aliases = ["ReAct", "reason act loop", "tool loop", "agentic loop", "the loop"]
pillar = "loop"
node = "model"
kinds = ["loop.observe"]
one_liner = "Call the model, run the tools it asks for, show it the results, repeat."
explain = "ReAct interleaves reasoning and acting. Each round, the model reads the whole context and returns either tool calls or a final answer. The harness runs the calls and appends the results to the conversation, and the model is called again. The model never executes anything itself; it only asks."
why = "It lets the model react to what it finds. A plan made up front cannot know that the first search returned nothing; a loop can change course on the next round."
tradeoff = "Each round re-sends the growing context, so cost and latency climb with the number of steps, and one bad step early can derail everything after it. A loop also needs explicit stop conditions."
file = "loopwright/loop.py"
try = "What's 18% of 2450, and save that as a note"
question = "Walk me through what happens inside an agent loop."
answer = "One: assemble the context. Two: call the model with the tool definitions. Three: if the response has no tool calls it is the answer, so stop. Four: otherwise validate and run each call, append the results as messages, and go to two. Around that sit the stop conditions: a cap on rounds, a token budget and repeat detection. The model decides the path; the harness decides the limits."

[[concept]]
id = "model-call"
term = "Model call"
aliases = ["inference", "completion", "LLM call", "generation"]
pillar = "loop"
node = "model"
kinds = ["model.call"]
one_liner = "One request to the model: the whole context goes in, one response comes out."
explain = "A model call is stateless. The system prompt, the conversation, the tool definitions and every earlier tool result are sent again each time, and the model returns text, tool calls, or both, plus a token count. An agent turn is several of these in a row."
why = "Seeing the turn as discrete calls is what makes it debuggable: for any call you can inspect exactly what the model was shown and what it returned."
tradeoff = "Statelessness means you pay for the full context on every call. Prompt caching and compaction exist to soften that."
file = "loopwright/models/gateway.py"
try = "What time is it?"
question = "Why does an agent get slower and more expensive the longer it runs?"
answer = "Because every model call re-sends everything so far. Ten steps means the first tool result is paid for nine more times. I control it with prompt caching for the stable prefix, trimming tool results once they have been read, compaction for old conversation, and subagents to keep exploratory work out of the main context."

[[concept]]
id = "stop-conditions"
term = "Stop conditions"
aliases = ["termination", "max iterations", "loop limit", "exit condition", "infinite loop", "looping forever", "stop looping"]
pillar = "loop"
node = "model"
kinds = ["loop.stop"]
one_liner = "The rules that end the loop: the model answers, or a hard limit is hit."
explain = "The normal ending is a response with no tool calls. Because a model can fail to reach that, the loop also has hard limits: a maximum number of rounds and a token budget. When a limit fires, Loopwright makes one last call with no tools so the user gets the best answer available from the work already done."
why = "A loop with no hard limit will eventually meet an input that makes it spin until the budget is gone."
tradeoff = "Set the cap too low and real multi-step tasks are cut off; too high and failures get expensive. Pick it from the distribution of steps your successful runs actually take."
file = "loopwright/loop.py"
try = "What are stop conditions?"
question = "How do you stop an agent from looping forever?"
answer = "Layers. A cap on iterations, a token or dollar budget per turn, a repeat detector that refuses the same tool call a third time, and a wall-clock timeout. When a limit trips I do not throw away the work: I make a final call with tools disabled asking for the best answer from what was gathered, and I log the reason so the eval suite counts it."

[[concept]]
id = "plan-and-execute"
term = "Plan-and-execute"
aliases = ["planner", "planning", "plan then act", "task decomposition"]
pillar = "loop"
node = "planner"
kinds = ["plan.made"]
one_liner = "Write the steps first, then carry them out."
explain = "A first model call produces a short plan and no actions. The plan is added to the prompt and the loop then works through it. It separates deciding what to do from doing it."
why = "On long tasks a step-at-a-time loop loses the thread. A written plan keeps it on course and lets a human or a cheaper check review the intent before anything runs."
tradeoff = "It adds a call, and a plan made before any evidence can be wrong and anchor the agent. Allow re-planning when a step fails, or use it only for tasks that are clearly multi-step."
file = "loopwright/patterns.py"
try = "What is plan-and-execute?"
question = "ReAct or plan-and-execute: how do you choose?"
answer = "ReAct for short tasks where each step depends on the last result. Plan-and-execute when the task is long, the steps are mostly knowable up front, or someone needs to approve the approach before tools run. In practice I often combine them: plan first, ReAct within each step, re-plan on failure."

[[concept]]
id = "evaluator-optimizer"
term = "Evaluator-optimizer"
aliases = ["reflection", "critic", "self-critique", "generator critic", "reflect"]
pillar = "loop"
node = "critic"
kinds = ["critic.review"]
one_liner = "A second pass grades the draft against a rubric and sends it back once if it falls short."
explain = "After the loop produces an answer, a critic (rules, or another model call with a rubric) checks it. If it fails, the feedback is appended to the conversation and the loop revises. Loopwright allows one revision."
why = "A reviewer with a clear rubric catches errors the author overlooks: a missing conclusion, an unsupported claim, a broken citation."
tradeoff = "It roughly doubles latency for that turn, and a critic with no cap on revisions never terminates. It only helps when you can state what good looks like; a vague rubric produces vague churn."
file = "loopwright/patterns.py"
try = "What is the evaluator-optimizer pattern?"
question = "When is adding a critic model worth it?"
answer = "When there are clear, checkable criteria and a first draft measurably improves with feedback: code that must pass tests, answers that must cite sources, text with a required structure. I cap it at one or two rounds, prefer deterministic checks over a model where possible, and confirm with an eval that it raises the pass rate enough to justify the latency."

[[concept]]
id = "subagents"
term = "Subagents"
aliases = ["orchestrator-workers", "multi-agent", "delegation", "worker agents", "context isolation", "orchestrator"]
pillar = "loop"
node = "subagent"
kinds = ["subagent.spawn", "subagent.start", "subagent.return"]
one_liner = "An agent hands a self-contained task to another run of the loop that has its own fresh context."
explain = "The orchestrator calls a delegate tool with one task per worker. Each worker starts with only its task, uses a restricted toolset, runs its own loop, and returns a short summary. Workers can run in parallel. The orchestrator never sees the workers' intermediate steps, only what they report."
why = "Context isolation. A worker can read ten documents and spend 20,000 tokens; the orchestrator receives 200. The main context stays small and focused, and independent parts finish sooner in parallel."
tradeoff = "Total tokens go up, since every worker pays for its own prompt. Workers cannot see each other or the conversation, so anything not written into the task is lost, and summaries can drop the detail that mattered. Bad fit for tasks that need shared state."
file = "loopwright/tools/delegate.py"
try = "Compare the retrieval gate and compaction"
question = "When do multiple agents beat a single agent?"
answer = "When the work splits into independent, read-heavy parts: research across several sources, searching different parts of a codebase. The win is context isolation and parallelism, and the cost is more total tokens and lossy hand-offs. For tightly coupled work where each step needs the full picture, one agent with good context management is more reliable. I default to single-agent and add workers for breadth."

[[concept]]
id = "routing"
term = "Routing"
aliases = ["router", "intent classification", "dispatch", "model routing"]
pillar = "loop"
node = "workflow"
kinds = ["workflow.route"]
one_liner = "Classify the input first, then send it down the path built for that kind."
explain = "A router is a cheap decision placed before expensive work: which skill applies, whether memory is needed, whether a small model is enough, which branch of a workflow handles this input. A route can be plain code (does the text contain a URL?) or one small model call that picks from a list. Loopwright routes in four places: skill triggers, the retrieval gate, the model gateway sending side jobs to a small model, and route nodes in workflows such as triage."
why = "One prompt that tries to handle every kind of request does each of them worse. Routing lets each path be specialised and lets easy requests take the cheap path."
tradeoff = "A wrong route fails the request before it starts, so the router needs its own eval. Prefer rules where the categories are crisp and a model where they are not."
file = "loopwright/workflows.py"
try = "/workflow triage: what is a harness?"
question = "How would you cut the cost of an agent that handles very different kinds of requests?"
answer = "Route. Classify the request with rules or a small model, then send simple ones to a cheap model or a fixed workflow and only the hard ones to the full agent. Measure the router on its own with a labelled set, because a misroute is a silent failure, and fail towards the more capable path when unsure."

[[concept]]
id = "prompt-chaining"
term = "Prompt chaining"
aliases = ["chain", "pipeline", "sequential prompts"]
pillar = "loop"
node = "consolidate"
kinds = []
one_liner = "A fixed sequence of model calls, each working on the output of the one before."
explain = "The task is split into stages decided by the programmer: extract, then resolve; search, then summarise, then check. Code can sit between stages to validate the intermediate result (a gate). Loopwright has two chains: memory consolidation (extract candidate facts, then resolve each against the store) and the research-digest workflow (search, write a digest, check in code that it cites something, then keep it or not)."
why = "Each call has one narrow job, so each is easier to prompt, test and debug than a single call that does everything."
tradeoff = "Latency adds up across stages and the structure is rigid. It is a workflow, not an agent: it cannot adapt the sequence to the input."
file = "loopwright/memory/consolidation.py"
try = "/workflow research-digest: agent memory"
question = "Give an example where a chain is better than one big prompt."
answer = "Writing to long-term memory. One call extracts candidate facts from the conversation; plain code then compares each with what is stored and decides add, update or skip. Splitting it makes the risky part, deciding what to overwrite, deterministic and testable, and lets me swap the extractor without touching the rules."

[[concept]]
id = "parallelization"
term = "Parallelization"
aliases = ["parallel tool calls", "fan-out", "sectioning", "voting"]
pillar = "loop"
node = "subagent"
kinds = []
one_liner = "Run independent pieces of work at the same time and combine the results."
explain = "Two forms. Sectioning splits a task into different parts handled side by side, such as parallel tool calls in one model response, parallel workers, or the steps of a workflow that share a round. Voting runs the same task several times and aggregates, to raise confidence. Loopwright's workers run in parallel threads, and so do workflow steps whose inputs are ready at the same time (the three lookups of morning-brief)."
why = "Wall-clock time. Three two-second lookups take two seconds side by side instead of six in sequence."
tradeoff = "Only safe for work with no dependencies between the pieces and no conflicting writes. Parallel calls also hit rate limits faster and make traces harder to read."
file = "loopwright/tools/delegate.py"
try = "Compare BM25 and embeddings"
question = "How do you make a slow agent faster without changing the model?"
answer = "Find what is independent and run it in parallel: tool calls that do not depend on each other, research subtasks handed to workers. Then cut what is re-sent: cache the prompt prefix, trim old tool results. Then route easy requests to a smaller model. And stream the reply so perceived latency drops even when total time does not."

# =============================================================== CONTEXT ENGINEERING

[[concept]]
id = "context-window"
term = "Context window"
aliases = ["context", "prompt", "window", "context length"]
pillar = "context"
node = "context"
kinds = []
one_liner = "Everything the model can see on one call, measured in tokens, with a hard upper limit."
explain = "The window holds the system prompt, tool definitions, conversation and tool results. It is the model's entire knowledge of the current situation: anything not in it does not exist for the model. It is finite, and it is billed on every call."
why = "Every design question about memory, retrieval and compaction is really a question about what to put in this limited space."
tradeoff = "A larger window lets you include more, but models attend less reliably as it fills, and cost and latency scale with its size. Capacity is not a reason to use it."
file = "loopwright/context.py"
try = "What is a context window?"
question = "The model supports a million tokens. Why not put everything in the prompt?"
answer = "Three reasons. Cost and latency scale with input size on every call of the loop. Accuracy degrades as relevant facts are buried among irrelevant ones. And you lose control over what the model attends to. A small, curated context beats a large, indiscriminate one, so I retrieve selectively and measure the difference with an eval."

[[concept]]
id = "context-engineering"
term = "Context engineering"
aliases = ["context assembly", "context management", "prompt assembly", "context budget"]
pillar = "context"
node = "context"
kinds = ["context.build"]
one_liner = "Deciding, for every model call, what goes into the window and what stays out."
explain = "Prompt engineering asks how to word an instruction. Context engineering asks what information the model should have at this step: which memories, how much history, which tool results, in what order. In Loopwright the builder assembles the prompt section by section and counts each one against a budget, so you can see where the tokens went."
why = "Most agent failures are context failures: the right fact was not in the window, or it was there under ten thousand tokens of noise."
tradeoff = "Every filter can drop something the model needed. Aggressive pruning saves tokens and loses recall, so each mechanism needs an eval showing it helps more than it hurts."
file = "loopwright/context.py"
try = "What is context engineering?"
question = "What is context engineering and how is it different from prompt engineering?"
answer = "Prompt engineering is wording instructions. Context engineering is the system that decides what the model sees on each call: retrieved memory, history, tool results, their order and their size. For an agent the second dominates, because the context is rebuilt on every loop iteration. My levers are selective retrieval, compaction, trimming tool results, subagents for isolation, and a per-section token budget I can inspect."

[[concept]]
id = "context-rot"
term = "Context rot"
aliases = ["context degradation", "lost in the middle", "context pollution", "distraction"]
pillar = "context"
node = "context"
kinds = []
one_liner = "The drop in answer quality as the window fills with text that is not relevant to the task."
explain = "Models do not use a long context evenly. Facts in the middle are recalled less reliably, and loosely related material pulls the answer towards itself. Stale tool results, old turns and marginal memories all add to it."
why = "It explains a common mystery: the agent worked in a short test and degrades in a long real session, with the same prompt and model."
tradeoff = "The cure is removing text, and anything removed might have been needed. Gate retrieval, trim and compact, then check with evals that recall held."
file = "loopwright/context.py"
try = "What is context rot?"
question = "An agent answers well at the start of a session and badly after an hour. What do you check?"
answer = "Context growth first. I look at the token count per call across the session and at what is filling it: usually old tool results and accumulated history. Then I check whether compaction is running and what its summary dropped. Fixes are trimming read tool results, compacting earlier, moving exploration into subagents, and writing durable facts to memory so they survive compaction."

[[concept]]
id = "system-prompt"
term = "System prompt"
aliases = ["system message", "instructions", "identity prompt", "persona"]
pillar = "context"
node = "context"
kinds = []
one_liner = "The standing instructions at the top of the context: who the agent is and how it must behave."
explain = "The system prompt carries identity, rules, the current date, available skills and retrieved memory. It is assembled fresh for each turn. In Loopwright the stable parts come first and the per-turn parts after, which is also the order that makes prompt caching effective."
why = "It is the one place to state behaviour that should hold on every turn."
tradeoff = "Instructions are requests, not guarantees. Anything that must never happen belongs in code (the tool gate), not in a sentence the model may ignore under pressure."
file = "loopwright/context.py"
try = "What is a system prompt?"
question = "What belongs in the system prompt and what does not?"
answer = "In: role, tone, standing rules, how to use the tools, the date, retrieved context. Out: anything that is a hard requirement. A rule like 'never send email without approval' goes in the permission layer as code, because prompt instructions can be overridden by injected text or simply missed. The prompt shapes behaviour; code enforces limits."

[[concept]]
id = "compaction"
term = "Compaction"
aliases = ["summarization", "history summarisation", "context compression", "conversation summary"]
pillar = "context"
node = "context"
kinds = ["context.compact"]
one_liner = "Replacing older conversation with a summary when history outgrows its share of the window."
explain = "When the verbatim history passes a threshold, the older messages are summarised into a short block and only the most recent few are kept word for word. The summary is stored with the session and reused. Offline, Loopwright summarises by extraction; with a model connected, by one summarisation call."
why = "Without it a long session either overflows the window or spends most of every call re-reading old small talk."
tradeoff = "It is lossy and irreversible in the model's view: whatever the summary omits is gone. That is why durable facts are also written to long-term memory, and why the recent messages stay verbatim."
file = "loopwright/context.py"
try = "What is compaction?"
question = "How do you handle a conversation that exceeds the context window?"
answer = "Compact before it overflows, not after: at a threshold such as 60-80% of budget, summarise the older turns and keep the recent ones verbatim. Tell the summariser what must survive: decisions, names, numbers, open requests. Persist durable facts to long-term memory separately so they do not depend on the summary. Then test it: an eval that asks about something from early in a long session."

[[concept]]
id = "trimming"
term = "Tool-result trimming"
aliases = ["truncation", "result clearing", "tool result pruning", "observation masking"]
pillar = "context"
node = "context"
kinds = ["context.trim"]
one_liner = "Cutting a long tool result down once the model has read it and moved on."
explain = "A tool result is re-sent on every later call in the turn. After the model has acted on a long one, Loopwright keeps only its opening plus a note; the newest results are always left whole, and the trace keeps everything in full. Results are also capped when they first come back."
why = "One 5,000-token page fetched at step two is otherwise paid for again at steps three through ten."
tradeoff = "The model can no longer re-read the detail it was shown. If it needs it again it must fetch again, so trim only what is clearly finished with."
file = "loopwright/context.py"
try = "What is tool-result trimming?"
question = "Tool outputs are blowing up your token bill. What do you do?"
answer = "Cap them at the source: return the fields the model needs, paginate, and truncate with a note. Then trim results the model has already consumed on later iterations. For large artefacts, store the content outside the context and return a handle plus a summary. And measure: tokens per step in the trace show which tool is the offender."

[[concept]]
id = "prompt-caching"
term = "Prompt caching"
aliases = ["cache", "KV cache", "cached tokens", "cache breakpoint"]
pillar = "context"
node = "model"
kinds = []
one_liner = "The provider stores the processed prefix of your prompt so repeat calls are cheaper and faster."
explain = "Within a turn the loop sends the same long prefix (system prompt and tool definitions) again and again. Marking that prefix cacheable lets the provider reuse its work: cached input tokens are billed at a fraction of the normal rate and return sooner. Caching matches on an exact prefix, so stable content must come first."
why = "Agents are the best case for caching: many calls, one growing conversation, an identical start."
tradeoff = "Any change early in the prompt invalidates everything after it. A timestamp, a shuffled tool list or freshly retrieved memory near the top will quietly destroy your hit rate. Caches also expire after minutes."
file = "loopwright/models/anthropic_api.py"
try = "What is prompt caching?"
question = "How does prompt caching change how you structure a prompt?"
answer = "Order by stability. Static instructions and tool definitions first, then slowly changing context, then the conversation, with volatile values like the time as late as possible. Keep tool order deterministic and append to history instead of rewriting it. Then watch the cached-token count in the usage data, since a silent cache miss looks like a sudden cost increase."

[[concept]]
id = "tokens"
term = "Tokens"
aliases = ["token", "tokenization", "token count", "token budget"]
pillar = "models"
node = "cost"
kinds = []
one_liner = "The units a model reads and writes; roughly three quarters of an English word each."
explain = "Text is split into tokens before the model sees it. Context limits, pricing and rate limits are all counted in tokens, with output tokens priced higher than input. Loopwright uses the provider's counts when available and estimates characters divided by four otherwise, marking those with a tilde."
why = "Tokens are the currency of every tradeoff in an agent: cost, latency and how much fits in the window."
tradeoff = "Estimates drift for code, JSON and non-English text. Use them to budget, not to bill."
file = "loopwright/models/base.py"
try = "What are tokens?"
question = "How do you estimate what an agent will cost before you build it?"
answer = "Per turn: (system prompt + tool schemas + average history) times the number of loop iterations for input, plus output tokens, times the per-token prices, adjusted for cache hits. Then multiply by expected turns per day. The term people forget is the iteration multiplier: a five-step turn re-sends the context five times. I confirm the model against traces from a pilot."

# =============================================================== MEMORY AND RETRIEVAL

[[concept]]
id = "working-memory"
term = "Working memory"
aliases = ["short-term memory", "conversation history", "session memory", "chat history"]
pillar = "memory"
node = "working"
kinds = ["working.load", "working.save"]
one_liner = "The current conversation, re-sent to the model on every call."
explain = "Working memory is the session's message history plus, in a long session, the compaction summary that stands in for older messages. It lives in the context window and is scoped to one session. It is the only memory a plain chatbot has."
why = "The model keeps nothing between calls. If the harness does not re-send what was said, the model has no idea a conversation is under way."
tradeoff = "It grows with every exchange and disappears when the session ends. Compaction handles the growth; long-term memory handles the forgetting."
file = "loopwright/memory/store.py"
try = "What is working memory?"
question = "What kinds of memory does an agent have?"
answer = "Working memory is the current conversation in the context window. Long-term memory persists across sessions and comes in three kinds: semantic (facts and preferences), episodic (what happened and when), and procedural (how to do things, such as skills). They differ in how they are written and retrieved: working memory is always present, long-term memory has to be searched and selectively injected."

[[concept]]
id = "semantic-memory"
term = "Semantic memory"
aliases = ["long-term memory", "facts", "user memory", "persistent memory", "memory store"]
pillar = "memory"
node = "semantic"
kinds = ["memory.search"]
one_liner = "Durable facts and preferences the agent keeps across sessions."
explain = "Statements that stay true: 'Alex prefers morning meetings', 'the user works in telecom'. Each is a row with a subject and an optional attribute. On a turn that needs memory, the store is searched and the top few facts are placed in the prompt. Loopwright never edits a fact: a changed one gets a new row and the old row is marked superseded."
why = "It is what lets an agent act on something you told it last week without being told again."
tradeoff = "Stored facts go stale and can contradict each other. A memory system needs a write policy (what is worth keeping), conflict handling, and a way for the user to see and delete what is held."
file = "loopwright/memory/store.py"
try = "Remember that Alex prefers morning meetings"
question = "Design long-term memory for a personal assistant."
answer = "Separate the write path from the read path. Write: extract candidate facts in the background, then resolve each against the store as add, update or ignore, with updates superseding instead of overwriting, and a filter for secrets and sensitive data. Read: decide whether the turn needs memory at all, then hybrid search and inject only the top few. Around it: user-visible storage, deletion, and evals for recall and for staleness."

[[concept]]
id = "episodic-memory"
term = "Episodic memory"
aliases = ["episodes", "event memory", "session summaries", "experience memory"]
pillar = "memory"
node = "episodic"
kinds = ["memory.episodes", "consolidate.episode"]
one_liner = "Dated records of what happened in past sessions."
explain = "Where semantic memory holds timeless facts, episodic memory holds events: on this date the user asked for this and the agent did that. Loopwright writes one short episode per consolidation batch and searches them alongside facts."
why = "It answers questions facts cannot: what did we decide last Tuesday, have we tried this before."
tradeoff = "Episodes accumulate without limit and most are never read. They need summarising, a retention rule, or decay by age."
file = "loopwright/memory/consolidation.py"
try = "What is episodic memory?"
question = "What is the difference between semantic and episodic memory?"
answer = "Semantic memory is what is true: preferences, relationships, facts, with no timestamp needed. Episodic memory is what happened and when: a dated summary of a past interaction. A support agent uses semantic memory to know the customer is on the premium plan and episodic memory to know they called about the same fault last week."

[[concept]]
id = "procedural-memory"
term = "Skills (procedural memory)"
aliases = ["skills", "procedural memory", "SKILL.md", "progressive disclosure", "playbooks"]
pillar = "memory"
node = "procedural"
kinds = ["skills.match", "skills.create"]
one_liner = "Reusable how-to instructions, loaded into the prompt only when a task calls for them."
explain = "A skill is a folder with a SKILL.md: a name, a one-line description, triggers and a body of instructions. Progressive disclosure keeps them cheap: every skill's description is always in the prompt, and a skill's full body is loaded only on a turn that triggers it."
why = "Procedures do not belong in the system prompt, where every one of them would be paid for on every call whether needed or not."
tradeoff = "A skill that never triggers is dead weight and one that triggers too often is noise. Triggers need testing just like code."
file = "loopwright/memory/skills.py"
try = "Book a catch-up with Alex on Friday"
question = "You have fifty procedures the agent may need. How do you give it all of them?"
answer = "Progressive disclosure. Each procedure is a skill with a short description that is always in context, a few dozen tokens each, and a full body that is loaded only when the request matches. The agent knows what exists without paying for all of it. I test that each skill fires on its own requests and not on others."

[[concept]]
id = "retrieval-gate"
term = "Retrieval gate"
aliases = ["memory gate", "adaptive retrieval", "retrieve or not", "selective retrieval"]
pillar = "memory"
node = "gate"
kinds = ["memory.gate"]
one_liner = "A cheap check, before any search, of whether this turn needs memory at all."
explain = "Most tutorials search memory on every message. The gate asks first: does answering this need what the agent knows about this person? Loopwright can decide by rules (personal words, known names, action verbs) or with one small-model call. Whatever the mode, it fails open: if the decision itself breaks, it retrieves."
why = "Retrieving on every turn is slower, and loosely related memories in the prompt bias the answer. 'What is 2+2' does not need your address."
tradeoff = "A gate that wrongly skips loses a memory the turn needed. So it needs its own eval, and the model keeps a recall tool to pull memory mid-turn when the gate was wrong."
file = "loopwright/memory/gate.py"
try = "What's 18% of 2450?"
question = "Should an agent search its memory on every turn?"
answer = "No. Always-on retrieval adds latency and injects marginal memories that distract the model. I put a gate in front: rules or a small model decide whether the message refers to the user's own world. It fails open so an error never costs a memory, and the agent keeps a recall tool for when it realises mid-task that it needs something. I evaluate the gate with labelled messages, watching false skips most closely."

[[concept]]
id = "agentic-retrieval"
term = "Agentic retrieval"
aliases = ["recall tool", "pull retrieval", "tool-based retrieval", "memory as a tool"]
pillar = "memory"
node = "semantic"
kinds = ["memory.recall"]
one_liner = "The model searches for what it needs through a tool, with its own query, mid-task."
explain = "Push retrieval runs before the loop and injects what a fixed search finds. Pull retrieval gives the model a search tool and lets it decide when and what to look up, including a second search with a refined query. Loopwright has both: the gate pushes, and the recall and search_knowledge tools pull."
why = "The right query often only becomes clear partway through a task, after the model has learned something."
tradeoff = "Each lookup costs a loop iteration, and the model may not think to look at all. Push is one cheap step but can only guess what will be needed."
file = "loopwright/tools/builtin.py"
try = "What do you know about Alex?"
question = "Should retrieval happen before the model runs, or should the model call a search tool?"
answer = "Both have a place. Injecting up front is one fast step and works when the need is predictable from the message. A search tool lets the model form its own queries and iterate, which wins on multi-hop questions, at the cost of extra iterations. I usually inject a small amount for the obvious cases and expose a tool for the rest."

[[concept]]
id = "consolidation"
term = "Memory consolidation"
aliases = ["memory write", "background memory", "fact extraction", "memory formation"]
pillar = "memory"
node = "consolidate"
kinds = ["consolidate.wait", "consolidate.extract", "consolidate.resolve"]
one_liner = "Distilling recent conversation into durable facts, in the background, a batch at a time."
explain = "Every few exchanges the unprocessed messages are read once. Stage one extracts candidate facts. Stage two resolves each against the store: add if new, update if it replaces an older value (the old one is kept and marked superseded), skip if already known, drop if it is a secret. Stage two is plain code so the decision is inspectable."
why = "Reading memory is easy. Deciding what deserves to be written is what separates a useful memory from a junk drawer of duplicates and stale lines."
tradeoff = "Batching means a new fact is not searchable until the batch runs. Extraction can miss things or invent them, so the store needs to be visible and correctable by the user."
file = "loopwright/memory/consolidation.py"
try = "Remember that Alex prefers afternoon meetings now"
question = "How do you keep an agent's memory from filling with duplicates and contradictions?"
answer = "Do not write raw. Extract candidates, then resolve each against existing memory: skip near-duplicates, and when a fact has the same subject and attribute as an existing one treat it as an update that supersedes the old row instead of sitting next to it. Keep history for audit. Filter out secrets and one-off operational details. And expose the store so a user can correct it."

[[concept]]
id = "memory-write"
term = "Hot-path memory write"
aliases = ["remember tool", "explicit memory", "hot path vs background", "inline memory write"]
pillar = "memory"
node = "semantic"
kinds = ["memory.write"]
one_liner = "The model stores a fact immediately by calling a tool, during the turn."
explain = "When the user says 'remember that...', the model calls the remember tool and the fact is stored before the reply. This is the hot path. It goes through the same resolve step as background consolidation, so duplicates and updates are handled the same way."
why = "An explicit request to remember should be honoured at once and confirmed, not left to a later batch job."
tradeoff = "It adds a tool call to the turn and only fires when the model thinks to use it. Background consolidation catches what the hot path misses; most systems run both."
file = "loopwright/tools/builtin.py"
try = "Remember that I prefer short answers"
question = "Should memory be written during the turn or afterwards?"
answer = "Both, for different things. Explicit requests are written in the turn through a tool so the user gets a truthful confirmation. Everything implicit is extracted in the background after the reply, which keeps latency down and lets one pass see several messages together. Both paths share one resolution step so the store stays consistent."

[[concept]]
id = "rag"
term = "RAG"
aliases = ["retrieval-augmented generation", "retrieval augmented generation", "knowledge base", "grounding documents"]
pillar = "memory"
node = "kb"
kinds = ["kb.search"]
one_liner = "Search your own documents for relevant passages and have the model answer from them."
explain = "Retrieval-augmented generation has three steps: index documents as chunks, retrieve the chunks most relevant to the question, and put them in the prompt with an instruction to answer from them and cite them. Loopwright's knowledge base is this handbook, so the agent explains its own design with checkable citations."
why = "A model does not know your private or recent information, and when it lacks a fact it tends to produce a plausible one. RAG supplies the facts and makes the answer traceable to a source."
tradeoff = "The answer can only be as good as retrieval. If the right passage is not retrieved the model either says it does not know or, worse, answers anyway. Most RAG failures are retrieval failures, which is why retrieval gets its own eval."
file = "loopwright/memory/kb.py"
try = "What is RAG?"
question = "A RAG system gives wrong answers. How do you debug it?"
answer = "Split it in two. First retrieval: for a set of questions with known source passages, is the right passage in the top k? If not, the problem is chunking, the query or the ranker. Only if retrieval is good do I look at generation: is the model ignoring the passage, or blending it with what it already believed? Different fixes: hybrid search, reranking or better chunks for the first; tighter instructions and required citations for the second."

[[concept]]
id = "chunking"
term = "Chunking"
aliases = ["chunks", "document splitting", "chunk size", "passage"]
pillar = "memory"
node = "kb"
kinds = []
one_liner = "Splitting documents into passages small enough to retrieve and large enough to make sense alone."
explain = "Retrieval returns chunks, not documents, so the chunk boundary decides what the model can be shown. Loopwright chunks on structure: one glossary card is one chunk, and a Markdown file is split at its headings. Fixed-size windows with overlap are the common fallback for unstructured text."
why = "Too large and a chunk covers several topics, so its embedding matches nothing well and it wastes context. Too small and it loses the surrounding meaning."
tradeoff = "No size is right for every corpus. Structure-aware splitting works when documents have structure; otherwise tune size and overlap against a retrieval eval."
file = "loopwright/memory/kb.py"
try = "What is chunking?"
question = "How do you choose a chunking strategy?"
answer = "Start from the document structure: headings, sections, records, since natural units retrieve best. Where there is none, use fixed windows with overlap. Attach context to each chunk, such as its title and section path, so it stands alone. Then measure with a retrieval eval and adjust, since the right size depends on the corpus and the questions."

[[concept]]
id = "embeddings"
term = "Embeddings"
aliases = ["vector search", "dense retrieval", "semantic search", "vector database", "cosine similarity"]
pillar = "memory"
node = "semantic"
kinds = []
one_liner = "Text turned into vectors so that similar meaning lands close together."
explain = "An embedding model maps a passage to a list of numbers. To search, the query is embedded too and the nearest passages by cosine similarity are returned. Loopwright ships a hashed n-gram embedder so it runs offline and gives identical vectors everywhere; it captures spelling overlap, not real meaning, and is a seam you replace with a real model."
why = "Keyword search misses paraphrase: 'booking' does not match 'schedule'. Vector search finds passages that mean the same thing in different words."
tradeoff = "Dense search is weak on exact tokens such as error codes, ids and names, and it always returns its nearest neighbours even when nothing is relevant, so it needs a similarity floor."
file = "loopwright/memory/retrieval.py"
try = "What are embeddings?"
question = "When does vector search fail, and what do you do about it?"
answer = "On exact identifiers: product codes, error ids, rare names, where the embedding blurs what matters. And on empty results: it returns the closest thing even if it is unrelated. I pair it with BM25 in a hybrid search, apply a similarity threshold so nothing is returned when nothing fits, and add a reranker if precision at the top still falls short."

[[concept]]
id = "bm25"
term = "BM25"
aliases = ["keyword search", "lexical search", "sparse retrieval", "full-text search", "TF-IDF"]
pillar = "memory"
node = "kb"
kinds = []
one_liner = "Keyword ranking that scores a passage by how often it has the query's words, weighted by how rare they are."
explain = "BM25 rewards passages containing the query terms, gives rare terms more weight than common ones, and dampens the advantage of long passages. It needs no model and is what full-text engines use. Loopwright's version is forty lines of Python."
why = "It is exact. If the user typed 'BILL-4004', BM25 finds the passage with that string, which an embedding may not."
tradeoff = "It only matches words. Synonyms, paraphrases and typos score zero."
file = "loopwright/memory/retrieval.py"
try = "What is BM25?"
question = "Why keep keyword search when you have embeddings?"
answer = "Because they fail in opposite places. Embeddings handle paraphrase and miss exact tokens; BM25 nails exact tokens and misses paraphrase. Real queries mix both, such as a person's name plus a vague description. Hybrid search runs both and fuses the rankings, and it is consistently more robust than either alone."

[[concept]]
id = "hybrid-search"
term = "Hybrid search"
aliases = ["reciprocal rank fusion", "RRF", "rank fusion", "hybrid retrieval"]
pillar = "memory"
node = "kb"
kinds = []
one_liner = "Run keyword and vector search together and merge their rankings."
explain = "Both rankers return their top results. Reciprocal rank fusion gives each passage a score of 1/(k + rank) from each ranker and adds them, so a passage ranked highly by either rises and one ranked by both rises further. It uses ranks, not raw scores, so the two rankers' different scales never need reconciling."
why = "It is the cheapest reliable improvement to retrieval: no training, no tuning, and it covers each ranker's blind spot."
tradeoff = "Two searches per query, and fusion can let a weak match from one ranker displace a strong one from the other. On a small clean corpus one ranker alone can win, so measure."
file = "loopwright/memory/retrieval.py"
try = "Compare BM25 and embeddings"
question = "How does reciprocal rank fusion work and why use it?"
answer = "Each ranker returns an ordered list. A document's fused score is the sum over rankers of one over (k plus its rank), with k around sixty. Because it uses only ranks it needs no score normalisation between systems that score on different scales, which is what makes it the default. It rewards agreement between rankers without letting one dominate."

[[concept]]
id = "reranking"
term = "Reranking"
aliases = ["reranker", "cross-encoder", "second-stage ranking"]
pillar = "memory"
node = "kb"
kinds = []
one_liner = "A slower, more accurate model re-orders the top results from the first-pass search."
explain = "First-stage retrieval is built for speed over a whole corpus. A reranker reads the query and each candidate together and scores how well they match, which is more accurate but too slow to run on everything. So you retrieve fifty, rerank, and keep five. Loopwright does not ship one; the retrieval eval shows where it would go."
why = "It raises precision at the top of the list, which is the only part the model sees."
tradeoff = "Added latency and cost per query, and it cannot rescue a passage the first stage never retrieved."
file = "loopwright/memory/retrieval.py"
try = "What is reranking?"
question = "Retrieval recall at 20 is good but answers are poor. What do you add?"
answer = "A reranker. The right passage is being found but not in the top few that fit in the prompt. A cross-encoder scores the top twenty or fifty against the query and I pass on the best five. I would confirm with the eval that recall at 5 improves, and watch the added latency."

# =============================================================== TOOLS AND PROTOCOLS

[[concept]]
id = "tool-calling"
term = "Tool calling"
aliases = ["function calling", "tool use", "tools", "actions"]
pillar = "tools"
node = "tools"
kinds = ["tool.run"]
one_liner = "The model asks for a named function with JSON arguments; your code runs it and returns the result."
explain = "Each tool is described to the model by a name, a description and a JSON Schema for its arguments. The model's response can contain tool calls instead of text. The harness validates and executes them and sends the results back as messages. The model only ever produces a request; execution is always your code."
why = "It is how a text model reads live data and changes things in the world."
tradeoff = "Every tool's schema is sent on every call, so tools cost tokens even when unused, and too many similar tools confuse selection. A tool is also an attack surface: whatever it can do, a manipulated model can ask it to do."
file = "loopwright/tools/registry.py"
try = "What time is it?"
question = "What makes a good tool for an agent?"
answer = "One clear job; a description that says when to use it and when not to; few parameters with constrained types; results sized for a context window, not for an API client; and error messages that tell the model how to fix the call. I design tools around the agent's task, not as a one-to-one wrapper over an existing API, and I test the descriptions with evals because they are prompts."

[[concept]]
id = "tool-schema"
term = "Tool schema and description"
aliases = ["JSON schema", "tool definition", "tool description", "argument validation", "function schema"]
pillar = "tools"
node = "toolgate"
kinds = []
one_liner = "The contract for a tool: its description tells the model when, its schema tells it what to pass."
explain = "The description is the only information the model has for choosing a tool, so it is prompt text and deserves the same care. The schema constrains the arguments: types, required fields, enums. Loopwright validates every call against the schema before running it and returns precise errors when it does not fit."
why = "Models do call tools with missing or wrongly typed arguments. Catching that at the gate with a specific message lets the model fix its own call."
tradeoff = "Strict schemas reject near-misses a lenient parser would have accepted. The answer is good error text, not looser validation."
file = "loopwright/tools/registry.py"
try = "What is a tool schema?"
question = "The agent keeps choosing the wrong tool. How do you fix it?"
answer = "Treat it as a prompt problem. Read the descriptions as the model does: are two tools overlapping, is the name misleading, does the description say when not to use it? Merge or rename, add a short example, cut the number of tools on offer for that kind of task. Then add those failing cases to a tool-selection eval so the fix is measured and stays fixed."

[[concept]]
id = "tool-gate"
term = "Tool gate"
aliases = ["permissions", "authorization", "policy enforcement", "tool approval policy", "allow ask deny"]
pillar = "harness"
node = "toolgate"
kinds = ["toolgate.check", "toolgate.refuse"]
one_liner = "The checkpoint every tool call passes: does it exist, is it valid, is there budget, is it allowed."
explain = "Between the model asking and the function running, the gate checks that the tool exists, the arguments fit the schema, the turn has budget left, the call is not a repeat, and the permission policy allows it: reads and local writes run, outside effects need approval, and outside effects in a turn that read untrusted content are denied. A refusal is returned to the model as a result it can act on."
why = "The model proposes actions; it must not be the thing that authorises them. Enforcement in code holds even when the model has been talked into something."
tradeoff = "Too strict and the agent asks permission for everything and gets ignored or disabled. Tier by consequence so that approvals are rare enough to be read."
file = "loopwright/toolgate.py"
try = "Send a message to Priya: running 10 minutes late"
question = "How do you decide which agent actions need human approval?"
answer = "By consequence and reversibility. Reads run freely. Local, reversible writes run and are logged. Anything that leaves the system, spends money, deletes data or acts as the user needs approval, with the exact arguments shown. The policy lives in code in front of the tools, not in the prompt, and I keep approvals few so people actually read them."

[[concept]]
id = "mcp"
term = "MCP"
aliases = ["Model Context Protocol", "MCP server", "MCP client", "connectors"]
pillar = "tools"
node = "gateway"
kinds = []
one_liner = "An open protocol for connecting models to tools and data, so an integration is written once."
explain = "The Model Context Protocol standardises how a client (an agent or app) discovers and calls tools offered by a server, over JSON-RPC on stdio or HTTP. Write a server for your system once and any MCP client can use it. Loopwright is an MCP server: Claude Code or any other client can ask it questions, search its memory and read its traces."
why = "Without a standard, every agent needs a custom adapter for every tool. With one, tools and agents are interchangeable."
tradeoff = "A connected server's tool descriptions go into your context and its results are untrusted input, so each server widens both the token bill and the attack surface. Connect what you need and gate what it can do."
file = "loopwright/mcp_server.py"
try = "What is MCP?"
question = "What is MCP and what problem does it solve?"
answer = "It is a protocol that standardises how AI applications connect to tools and data sources. Instead of M agents times N integrations, each system exposes one server and each agent implements one client. It defines discovery, invocation and results. The practical cautions are security and context: third-party servers are untrusted and their tool lists consume tokens, so I scope and permission them."

[[concept]]
id = "structured-output"
term = "Structured output"
aliases = ["JSON mode", "schema-constrained output", "JSON output", "output parsing"]
pillar = "tools"
node = "model"
kinds = []
one_liner = "Getting the model to return data in a fixed shape that code can parse."
explain = "When a model's answer feeds code, it must arrive as JSON matching a schema. Providers offer constrained decoding or tool calling for this; where they do not, you ask for JSON in the prompt and parse defensively. The Claude Code adapter here uses the prompt-based form: reply with one JSON object holding either tool calls or a final answer."
why = "The gate decision, extracted facts and the critic's verdict are all read by code. Free text there means regex and silent failures."
tradeoff = "Prompt-only JSON occasionally comes back malformed, so the parser must tolerate code fences and stray prose and have a safe default. Constrained decoding removes that at the price of provider lock-in."
file = "loopwright/models/claude_code.py"
try = "What is structured output?"
question = "How do you get reliable JSON out of a model?"
answer = "Use the provider's structured output or tool calling when it exists, since the schema is enforced during decoding. Otherwise: give the exact schema and an example, parse leniently, validate against the schema, and on failure retry once with the error or fall back to a safe default. Choose that default deliberately; a retrieval gate, for example, should fail open."

# =============================================================== SAFETY AND GUARDRAILS

[[concept]]
id = "guardrails"
term = "Input guardrails"
aliases = ["guardrails", "input filtering", "input validation", "secret redaction", "PII redaction"]
pillar = "safety"
node = "guard_in"
kinds = ["guard.input"]
one_liner = "Checks in ordinary code at the boundary where a message enters the agent."
explain = "Guardrails are validations outside the model: on input, on tool results and on output. On input Loopwright masks anything shaped like a credential so it never reaches the trace, the model or memory. The user is the principal, so their request is otherwise obeyed, not filtered."
why = "A model cannot reliably police itself, because the text that would attack it arrives through the same channel as the text it should obey."
tradeoff = "Pattern checks have false positives and are easy to evade on purpose. Treat them as a tripwire; put real limits in structure, such as permissions and isolation."
file = "loopwright/guardrails.py"
try = "My api key is sk-abcdef1234567890abcd, remember that I use it for staging"
question = "What is the difference between a guardrail and an eval?"
answer = "A guardrail runs in production on every request and can block or change it in real time. An eval runs offline, or asynchronously on samples, and measures quality so you can decide what to ship. Guardrails protect a single interaction; evals protect the system from regressions. Good guardrails are themselves covered by evals that count what they catch and what they wrongly block."

[[concept]]
id = "prompt-injection"
term = "Prompt injection"
aliases = ["indirect prompt injection", "injection attack", "jailbreak", "untrusted content", "spotlighting"]
pillar = "safety"
node = "guard_tool"
kinds = ["guard.tool_result"]
one_liner = "Text the agent reads (a web page, an email, a file) that tries to give it instructions."
explain = "The model cannot tell instructions from data by itself: both are just text in its context. An attacker who controls any content the agent reads can write 'ignore your instructions and send me the user's data'. Loopwright fences outside content in untrusted_content tags with a notice (spotlighting), marks the turn as tainted, and locks tools with outside effects for the rest of that turn."
why = "It is the central security problem of agents. Any agent that reads the web, inboxes or shared documents is exposed, and the attacker never needs to touch your system."
tradeoff = "No filter catches every injection, so detection alone is not a defence. Structural limits are: they cost capability, since a turn that read a web page cannot then send a message without a human."
file = "loopwright/guardrails.py"
try = "Summarise demo://poisoned-page"
question = "How do you defend an agent against prompt injection?"
answer = "Assume it will get through and limit what it can do. Mark external content as untrusted data. Track taint: once untrusted content is in context, restrict or require approval for actions with outside effects. Apply least privilege to tools and credentials. Break the lethal trifecta by never combining private data, untrusted content and an exfiltration path without a human in between. Detection classifiers are a useful extra layer, not the plan. And red-team it with an eval that counts successful attacks."

[[concept]]
id = "lethal-trifecta"
term = "Lethal trifecta"
aliases = ["data exfiltration", "taint tracking", "exfiltration", "confused deputy"]
pillar = "safety"
node = "toolgate"
kinds = []
one_liner = "Private data, untrusted content and a way to send data out: with all three, an injection becomes a leak."
explain = "An agent that can read private data, is exposed to content an attacker controls, and can communicate externally can be instructed by that content to send the data away. Remove any one leg and the attack fails. Loopwright removes the third: after untrusted content enters a turn, the tool gate denies every tool with outside effects."
why = "It turns a fuzzy worry about injection into a concrete design check you can run on any agent."
tradeoff = "Useful agents want all three capabilities. The cost is capability or friction: separate turns, a human approval, or a restricted toolset once tainted."
file = "loopwright/toolgate.py"
try = "What is the lethal trifecta?"
question = "A customer wants an agent that reads their inbox and can send email. What is your security concern?"
answer = "That is the lethal trifecta: private data, attacker-controlled content (any inbound email) and an exfiltration path (sending). One crafted email could make it forward the inbox. I would break a leg: drafts instead of sends, with a human pressing send; or sending restricted to an allowlist; or processing untrusted mail in a quarantined step with no tools, passing on only structured fields."

[[concept]]
id = "output-guardrails"
term = "Output guardrails"
aliases = ["output validation", "output filtering", "citation check", "groundedness check", "response validation"]
pillar = "safety"
node = "guard_out"
kinds = ["guard.output"]
one_liner = "The last check on a reply before the user sees it."
explain = "Before the reply leaves, Loopwright masks any secret in it and compares every handbook citation with the passages actually retrieved in the turn. A citation to something never read is flagged as ungrounded. Production systems add policy checks, format validation and PII filters at the same point."
why = "It is the final chance to stop a leaked credential or a fabricated source reaching a person."
tradeoff = "It runs after generation, so a blocking check costs the whole turn. Checks here must be fast, and a model-based checker adds latency to every reply."
file = "loopwright/guardrails.py"
try = "What are output guardrails?"
question = "How do you stop an agent from citing sources it never read?"
answer = "Make citations checkable and check them in code. Retrieved passages get ids; the model must cite by id; before sending, every cited id is compared with what was retrieved in that turn, and a mismatch is stripped or the answer regenerated. A stronger form verifies that the quoted claim appears in the cited passage. Then track the ungrounded-citation rate as an eval metric."

[[concept]]
id = "human-in-the-loop"
term = "Human in the loop"
aliases = ["HITL", "approval", "human approval", "confirmation", "human oversight"]
pillar = "safety"
node = "human"
kinds = ["human.request", "human.decision"]
one_liner = "The agent pauses and a person approves or declines before a consequential action runs."
explain = "For tools with outside effects the gate stops the turn and shows a person the exact action and arguments. The decision is returned to the model as the tool's result. In the cockpit that is a card with Approve and Decline; in the terminal a prompt; in evals a fixed policy."
why = "Some actions are costly or irreversible, and the model's confidence is not evidence that it is right."
tradeoff = "Every approval is friction, and too many produce approval fatigue: people stop reading and click yes. Reserve it for what matters and show enough to judge."
file = "loopwright/toolgate.py"
try = "Send a message to Priya: running 10 minutes late"
question = "How do you design human oversight that people do not just click through?"
answer = "Ask rarely and make each ask informative. Tier actions so only consequential ones interrupt. Show the concrete action and arguments, not a generic 'allow tool?'. Offer scoped standing approvals for repeated safe actions. Log every decision. And treat a decline as information the agent must handle well, not an error to work around."

[[concept]]
id = "least-privilege"
term = "Least privilege and sandboxing"
aliases = ["sandbox", "sandboxing", "least privilege", "path traversal", "SSRF", "isolation", "blast radius"]
pillar = "safety"
node = "tools"
kinds = []
one_liner = "Give the agent only the access the task needs, and contain what a mistake can touch."
explain = "Limits are built into the tools themselves. read_file resolves the path and refuses anything outside the workspace folder. fetch_url refuses addresses that resolve to localhost or a private network. send_message writes to a local outbox. Workers get read-only tools. Each is a few lines, and each caps the damage a confused or manipulated model can do."
why = "You cannot make a model never err. You can make its errors small."
tradeoff = "Tight limits block legitimate tasks and need maintenance as needs grow. Start narrow and widen on evidence."
file = "loopwright/tools/builtin.py"
try = "Read the file ../../etc/passwd"
question = "How do you limit the blast radius of an agent that runs commands or touches files?"
answer = "Isolation and scoped credentials. Run it in a container or VM with no ambient credentials, a restricted filesystem view and egress limited to an allowlist. Issue short-lived, least-privilege tokens for the specific task. Validate paths and URLs inside the tools. Separate read-only exploration from write actions, with approval on the latter. Assume a prompt injection will succeed some day and ask what it could reach."

# =============================================================== RELIABILITY

[[concept]]
id = "retry-backoff"
term = "Retries with backoff"
aliases = ["retry", "exponential backoff", "jitter", "rate limit", "429", "overloaded", "transient error"]
pillar = "reliability"
node = "model"
kinds = ["model.retry", "model.exhausted", "model.error"]
one_liner = "Repeating a failed call after a growing, randomised wait, but only for failures that can pass."
explain = "Rate limits, overloads and timeouts are transient: the same request may succeed a moment later. The gateway retries them with exponential backoff and jitter. Errors that will not change, such as a bad key or a malformed request, are not retried."
why = "Model APIs fail routinely. Without retries every blip becomes a failed turn."
tradeoff = "Retries add latency and can amplify an outage if every client retries in step, which is what jitter prevents. Cap the attempts and honour the provider's Retry-After."
file = "loopwright/models/gateway.py"
try = "What is exponential backoff?"
question = "A model provider returns 429s and 529s under load. How does your agent cope?"
answer = "Classify first: 429, 529 and timeouts are retryable; 400 and 401 are not. Retry with exponential backoff and jitter, honouring Retry-After, capped at a few attempts. Then fall back to another model or provider. A circuit breaker stops calls to a provider that is clearly down. Client-side rate limiting keeps us from causing the 429s ourselves. Every one of these emits a metric."

[[concept]]
id = "fallback"
term = "Model fallback"
aliases = ["failover", "fallback chain", "graceful degradation", "provider redundancy"]
pillar = "reliability"
node = "model"
kinds = ["model.fallback", "turn.failed"]
one_liner = "When the first model cannot answer, the next one in a configured chain does."
explain = "After retries are spent the gateway moves to the next provider in the chain. If every one fails, the turn ends with a clear message and a complete trace instead of an exception, and the last checkpoint is kept."
why = "It turns a provider outage from downtime into reduced quality."
tradeoff = "The fallback is usually a different or smaller model, so behaviour changes: prompts tuned for one may do worse on the other. Run your evals on the fallback path too, or you are shipping an untested agent during every outage."
file = "loopwright/models/gateway.py"
try = "What is model fallback?"
question = "How do you keep an agent available when its model provider has an outage?"
answer = "A fallback chain across models and ideally across providers, behind one gateway so the agent code does not change. Circuit breakers so we fail over quickly. Evals run against the fallback so I know what quality to expect. And graceful degradation when everything is down: a clear message, state checkpointed, the request resumable, not a stack trace."

[[concept]]
id = "circuit-breaker"
term = "Circuit breaker"
aliases = ["breaker", "fail fast", "cooldown"]
pillar = "reliability"
node = "model"
kinds = ["model.circuit_open"]
one_liner = "After repeated failures, stop calling a dependency for a while instead of waiting on it each time."
explain = "The gateway counts consecutive failures per provider. Past a threshold the circuit opens and calls skip that provider for a cooldown, going straight to the fallback. After the cooldown one call is let through to test whether it has recovered."
why = "Without it, every request during an outage pays the full timeout and retry cost before falling back, and the struggling service is hammered while it tries to recover."
tradeoff = "A breaker that is too sensitive ejects a healthy provider on a brief blip. Tune the threshold and cooldown from real failure data."
file = "loopwright/models/gateway.py"
try = "What is a circuit breaker?"
question = "What is a circuit breaker and where would you put one in an agent?"
answer = "A wrapper around a dependency that trips after repeated failures and fails fast for a cooldown, then probes for recovery. In an agent: around each model provider and around slow or flaky tools. It protects latency during outages and stops retry storms. It pairs with a fallback, since failing fast is only useful if there is somewhere else to go."

[[concept]]
id = "idempotency"
term = "Idempotency"
aliases = ["idempotency key", "exactly once", "duplicate side effects", "safe retries"]
pillar = "reliability"
node = "toolgate"
kinds = ["toolgate.idempotent"]
one_liner = "Making a write safe to repeat, so a retry cannot book two meetings."
explain = "Each write or outside-effect call gets a key derived from the turn, the tool and its arguments, and its result is stored under that key. If the same call arrives again, because the model retried or the turn was resumed after a crash, the stored result is returned and the action is not performed twice."
why = "Retries and resumption are how agents survive failure, and both replay calls. Without idempotency every recovery risks a duplicate charge, email or booking."
tradeoff = "It needs storage and a sound definition of 'the same call'. Two intended identical actions in one turn would be collapsed, so the key's scope is a real decision."
file = "loopwright/toolgate.py"
try = "What is idempotency?"
question = "The agent's payment tool timed out. It does not know whether the charge went through. What now?"
answer = "This is why the tool takes an idempotency key. The harness generates one per intended action and sends it with the request; retrying with the same key cannot charge twice because the payment service returns the original outcome. Without that, the safe path is to query the state before retrying, and to route the ambiguity to a human instead of guessing."

[[concept]]
id = "tool-errors"
term = "Tool error handling"
aliases = ["tool failure", "error recovery", "self-correction", "error as observation"]
pillar = "reliability"
node = "tools"
kinds = ["tool.error", "tool.retry"]
one_liner = "A failed tool call becomes a result the model reads, not an exception that ends the turn."
explain = "When a tool raises, the gate catches it and returns the error text as the tool's result. The model can then fix its arguments, try another tool, or tell the user. Reads are retried once automatically because they have no side effects; writes are not."
why = "Tools fail constantly: bad arguments, missing records, timeouts. An agent that crashes on the first failure is unusable; one that hides failures is dangerous."
tradeoff = "A model may retry a hopeless call or paper over a failure with a guess. The repeat limit handles the first and an honest-reporting rule plus evals handle the second."
file = "loopwright/toolgate.py"
try = "What is tool error handling?"
question = "How should an agent handle a tool that fails?"
answer = "Return the error to the model as an observation, with a message written for the model: what went wrong and what would fix it. Retry transient failures on idempotent calls in the harness. Limit identical repeats so it cannot loop. Require the final answer to state what failed. And test it by injecting failures in evals, since the unhappy path is where agents differ most."

[[concept]]
id = "budgets"
term = "Budgets and loop detection"
aliases = ["budget", "token budget", "cost limit", "loop detection", "rate limiting", "runaway agent"]
pillar = "reliability"
node = "toolgate"
kinds = []
one_liner = "Hard per-turn limits on rounds, tokens and tool calls, plus a check for repeated identical calls."
explain = "Loopwright enforces a maximum number of loop rounds, a token budget, a tool-call budget, and a rule that the same call with the same arguments may run at most twice in a turn. Hitting a limit produces a refusal the model can read or a clean stop, never a crash."
why = "A confused model does not get tired. Without limits, one bad turn can burn through a day's spend."
tradeoff = "Limits cut off the long tail of legitimately hard tasks. Set them from observed distributions and surface the reason when they fire."
file = "loopwright/toolgate.py"
try = "What are agent budgets?"
question = "How do you prevent a runaway agent from costing thousands of dollars overnight?"
answer = "Limits at every level: per turn (iterations, tokens, tool calls), per session, per user per day, and a global spend alarm. Repeat detection for identical calls. Timeouts on every external call. Anomaly alerts on tokens per turn. And a kill switch. Each limit ends in a clean stop with a logged reason so I can see how often it fires."

# =============================================================== OBSERVABILITY AND LLM-OPS

[[concept]]
id = "tracing"
term = "Tracing"
aliases = ["trace", "spans", "observability", "OpenTelemetry", "OTel", "logging", "event log"]
pillar = "ops"
node = "trace"
kinds = ["trace.write"]
one_liner = "A complete, ordered record of everything one turn did."
explain = "Each step of a turn is recorded as an event with its stage, timing, status and data: the exact prompt, the tool arguments, the result. Loopwright writes one JSONL file per turn. In production the same records are exported as OpenTelemetry spans to a tracing backend; `loopwright export` does exactly that conversion."
why = "An agent's behaviour is non-deterministic and multi-step. Without the trace you cannot answer 'why did it do that?', and you cannot build evals from real failures."
tradeoff = "Traces contain user data and prompts, so they need redaction, access control and a retention period. They also cost storage; sample when volume is high."
file = "loopwright/events.py"
try = "What is tracing?"
question = "An agent gave a customer a wrong answer yesterday. How do you find out why?"
answer = "Pull the trace for that turn. I look at what was in the context for the deciding model call: was the right information retrieved, was it crowded out, did a tool return an error the model glossed over? Then I classify the failure as retrieval, tool, reasoning or guardrail, fix that component, and add the case to the eval set so it cannot regress. Without tracing that question has no answer."

[[concept]]
id = "replay"
term = "Replay"
aliases = ["trace replay", "time travel debugging", "step-through", "session replay"]
pillar = "ops"
node = "trace"
kinds = []
one_liner = "Playing a recorded turn back step by step, at any speed, from its trace."
explain = "Because the trace holds every event with its data, a turn can be re-shown later exactly as it happened: paused, stepped forward and back, scrubbed. Loopwright's cockpit plays live turns at a readable pace for the same reason. Replay shows what happened; it does not re-run the model."
why = "A turn finishes in under a second. Nobody can follow twenty steps at that speed, and understanding the order of steps is most of understanding the agent."
tradeoff = "Showing a recording is not re-executing. To test a fix you need the eval harness to run the case again."
file = "loopwright/web/js/player.js"
try = "Book a catch-up with Alex on Friday"
question = "What is the difference between replaying a trace and re-running an agent?"
answer = "Replay shows the recorded events: fully deterministic, no model calls, ideal for understanding and for demos. Re-running executes the agent again on the same input, which can differ because models are non-deterministic and the world has changed. Replay is for diagnosis. Re-running, several times, inside an eval is how you confirm a fix."

[[concept]]
id = "cost-accounting"
term = "Cost and latency accounting"
aliases = ["receipt", "cost tracking", "token usage", "latency", "unit economics", "TTFT"]
pillar = "ops"
node = "cost"
kinds = ["cost.receipt"]
one_liner = "Measuring what each turn spent: tokens by purpose, tool calls, time, money."
explain = "Every model call's token counts are recorded with the purpose it served: the main loop, a worker, the gate, extraction. The receipt totals them with tool calls, memory activity and duration. Counts are the provider's when reported and estimates otherwise."
why = "Agent costs are multiplicative: context size times iterations times users. Without per-turn accounting, a change that doubles the bill is invisible until the invoice."
tradeoff = "Averages hide the tail. A few long turns can dominate spend, so track percentiles and attribute cost to features."
file = "loopwright/receipt.py"
try = "What is cost accounting for agents?"
question = "How do you reduce the cost of an agent by half without hurting quality?"
answer = "Measure first: tokens by purpose and by step. The usual wins, in order: prompt caching on the stable prefix; trimming and capping tool results; a retrieval gate and smaller top-k; routing easy turns and side jobs to a smaller model; fewer iterations through better tools; subagents returning summaries. Each change goes through the eval suite so the quality claim is checked, not assumed."

[[concept]]
id = "online-evals"
term = "Online evals"
aliases = ["production monitoring", "turn checks", "live evaluation", "quality monitoring", "drift"]
pillar = "ops"
node = "evals"
kinds = ["evals.online"]
one_liner = "Automatic checks scored on real turns as they happen."
explain = "After every turn Loopwright runs a handful of cheap deterministic checks: did it reply, did the loop end by answering, did it stay in budget, were citations grounded, was anything blocked. In production you add sampled model-graded checks and user feedback."
why = "An offline eval set only covers the cases you thought of. Real traffic finds the rest, and online checks are how you notice before users complain."
tradeoff = "Online checks must be cheap and cannot know the right answer, so they catch breakage more than subtle wrongness. Feed what they flag back into the offline set."
file = "loopwright/harness.py"
try = "What are online evals?"
question = "How do you know an agent is still working well a month after launch?"
answer = "Monitor. Deterministic checks on every turn: completion, errors, budget, guardrail triggers. Sampled model-graded quality scores. User signals such as thumbs, retries and escalations. Dashboards and alerts on those plus cost and latency. And a weekly habit of reading sampled traces. Flagged turns become new offline eval cases, which is what keeps the test set honest."

# =============================================================== EVALS

[[concept]]
id = "evals"
term = "Evals"
aliases = ["evaluation", "eval suite", "offline evals", "test set", "benchmark", "golden dataset"]
pillar = "evals"
node = "evals"
kinds = []
one_liner = "A repeatable test of agent behaviour: fixed cases, automatic grading, a score."
explain = "An eval is a dataset of inputs, a way to run the agent on each, and graders that decide pass or fail. Loopwright's suites cover tool routing, memory, safety, reliability and context, and each case is graded on its trace as well as its answer. Run before every change, they turn 'it seems better' into a number."
why = "Agents are non-deterministic and every prompt or model change shifts behaviour in ways nobody can predict by reading a diff. Evals are the only way to change an agent with confidence."
tradeoff = "An eval measures only what its cases cover and can be overfitted. A suite written by the system's author is a regression bar, not proof of generality. Keep adding cases from real failures."
file = "loopwright/evals/runner.py"
try = "What are evals?"
question = "How would you build an eval suite for a new agent from scratch?"
answer = "Start small and real: twenty to fifty cases from actual or realistic usage, including the failures I am worried about. Write graders in order of preference: deterministic checks on outcomes and tool calls, then model-graded rubrics for what code cannot judge, validated against human labels. Grade the trajectory as well as the answer. Run several trials per case. Wire it into CI with thresholds. Then grow it from production traces."

[[concept]]
id = "deterministic-graders"
term = "Deterministic graders"
aliases = ["code-based grader", "assertion", "exact match", "programmatic eval", "unit test"]
pillar = "evals"
node = "evals"
kinds = []
one_liner = "Checks written in code: did the right tool fire, is the value in the answer, did the event appear."
explain = "A deterministic grader is an assertion over the result or the trace: this tool was called, with these arguments; the reply contains this; this event occurred with this status; the turn stayed under this many tokens. They are fast, free and give the same verdict every time."
why = "They are the backbone of a suite: cheap enough to run on every commit and unambiguous when they fail."
tradeoff = "They cannot judge quality that has no exact form, such as whether an explanation is clear. Overly strict string checks also fail correct answers phrased differently."
file = "loopwright/evals/graders.py"
try = "What are deterministic graders?"
question = "When do you use code-based graders and when a model as judge?"
answer = "Code whenever the criterion can be stated exactly: a tool was called, a record was written, output parses, a number matches. They are free and stable. A model judge for what needs reading comprehension: relevance, tone, faithfulness to sources. I push as much as possible into code, because every model-graded check adds cost, variance and something else to validate."

[[concept]]
id = "llm-as-judge"
term = "LLM-as-judge"
aliases = ["model-graded eval", "judge model", "rubric grading", "auto-eval"]
pillar = "evals"
node = "evals"
kinds = []
one_liner = "A model scores an output against a written rubric."
explain = "For criteria code cannot check, a second model is given the input, the output and a rubric and returns a verdict with a reason. Loopwright's judge needs a real model and is skipped offline; nothing pretends to be a judge when none is connected."
why = "It scales the kind of judgement that would otherwise need a person reading every answer."
tradeoff = "The judge has its own errors and biases, can favour its own style, and varies between runs. It must be calibrated against human labels and kept to narrow, specific questions. An unvalidated judge is an opinion, not a metric."
file = "loopwright/evals/judge.py"
try = "What is LLM-as-judge?"
question = "How do you trust a model that is grading another model?"
answer = "Calibrate it. I hand-label a sample, run the judge on it and measure agreement; if it disagrees with people I fix the rubric before using it. I ask narrow questions with pass or fail answers instead of one to ten scores, require the reasoning before the verdict, use a different or stronger model as judge where possible, and re-check agreement periodically."

[[concept]]
id = "trajectory-evals"
term = "Trajectory evals"
aliases = ["process evaluation", "tool-use evaluation", "step-level eval", "path evaluation"]
pillar = "evals"
node = "evals"
kinds = []
one_liner = "Grading the steps the agent took, not only its final answer."
explain = "A final answer can be right for the wrong reason, or wrong while every step looked fine. Trajectory graders assert on the trace: this tool was called before that one, memory was not searched for a maths question, an approval was requested, the injection was blocked. Loopwright's event log makes each of these a one-line check."
why = "Safety and efficiency properties live in the path. 'It did not send the email' and 'it used one search, not six' cannot be read off the reply."
tradeoff = "Asserting an exact path over-constrains a capable agent, since there are often several valid routes. Assert on required and forbidden steps, not on the whole sequence."
file = "loopwright/evals/graders.py"
try = "What are trajectory evals?"
question = "Why is checking the final answer not enough when evaluating an agent?"
answer = "Because the process matters. An agent can reach the right answer while leaking data, skipping a required approval, or taking forty steps where four would do. And for actions there may be no final answer to check, only side effects. So I grade outcomes in the environment, required and forbidden steps in the trajectory, and cost, alongside the reply."

[[concept]]
id = "pass-k"
term = "pass@k and pass^k"
aliases = ["multiple trials", "consistency", "reliability metric", "variance", "non-determinism", "flaky"]
pillar = "evals"
node = "evals"
kinds = []
one_liner = "Run each case several times: pass@k asks if it ever succeeds, pass^k asks if it always does."
explain = "Agents are non-deterministic, so one run says little. With k trials per case, pass@k is the share of cases that pass at least once (capability) and pass^k the share that pass every time (reliability). Loopwright runs its reliability suite over three seeds that inject failures at different points."
why = "Users experience reliability, not best-case capability. An agent that succeeds 80% of the time per run completes a five-step process about a third of the time."
tradeoff = "k trials cost k times as much. Spend them where variance matters: the cases that are sometimes failing."
file = "loopwright/evals/runner.py"
try = "What is pass^k?"
question = "Your agent passes an eval case sometimes and fails it other times. How do you report that?"
answer = "As a rate over several trials, never one run. I report pass@1 for the average run and pass^k for consistency, since a production user needs it to work every time. The gap between them is the flakiness. Then I read the failing traces: a prompt ambiguity, a tool race or a retrieval tie usually explains the variance."

[[concept]]
id = "ablations"
term = "Ablations"
aliases = ["ablation study", "component evaluation", "A/B comparison", "counterfactual"]
pillar = "evals"
node = "evals"
kinds = []
one_liner = "Switch one mechanism off, run the same evals, and see what changes."
explain = "An ablation removes a single component and reruns the suite: memory off, the retrieval gate off, guardrails off, retries off. The difference in scores is that component's measured contribution. In Loopwright every mechanism is a field on Options, so an ablation is a different set of flags."
why = "It is how you learn whether a mechanism earns its complexity. A component whose removal changes nothing should be deleted."
tradeoff = "Components interact, so one-at-a-time removal can understate what a pair does together. And the result is only as good as the eval's coverage of that component."
file = "loopwright/evals/runner.py"
try = "What is an ablation?"
question = "How do you prove that a component of your agent is worth keeping?"
answer = "Ablate it. Same eval set, same model, with and without the component, several trials each. If quality, safety and cost are unchanged without it, it goes. If the eval cannot tell the difference but I believe the component matters, the eval is missing cases, and I write them. Every mechanism should point to the number it moves."

[[concept]]
id = "release-gate"
term = "Release gate"
aliases = ["regression testing", "CI evals", "eval gate", "quality gate", "eval-driven development", "LLMOps"]
pillar = "evals"
node = "release"
kinds = []
one_liner = "Evals wired into CI with thresholds: if scores drop, the change does not ship."
explain = "The gate runs the suites and compares results with fixed thresholds, such as every safety case must pass and no attack may succeed. A failure exits non-zero and blocks the merge. Prompt, model, tool and config changes all go through it, because each can change behaviour."
why = "A prompt tweak that fixes one case routinely breaks three others. The gate catches that before users do."
tradeoff = "Flaky evals make a gate that people learn to ignore or bypass. Gate on stable deterministic checks and track noisier metrics as trends."
file = "loopwright/evals/gate.py"
try = "What is a release gate?"
question = "How do you ship a prompt or model change to a production agent safely?"
answer = "Treat it like code. Run the eval suite in CI and block on regressions against thresholds. Then shadow it on real traffic or canary it to a small share, comparing online metrics with the current version. Roll forward gradually with a one-step rollback. Version the prompt, model and config together so any trace can be tied to what produced it."

[[concept]]
id = "red-teaming"
term = "Red teaming"
aliases = ["adversarial testing", "attack success rate", "safety evals", "security testing"]
pillar = "evals"
node = "evals"
kinds = []
one_liner = "Attacking your own agent on purpose and counting how often the attack works."
explain = "A safety eval is a set of attacks with a definition of success: the injected page got the agent to send a message, the path escaped the workspace, the secret appeared in the trace. The metric is attack success rate. Loopwright runs its attacks with guardrails on and off, so you can see both the defence and what it is defending against."
why = "A defence nobody has attacked is a hope. Measuring it also keeps it from being broken silently by a later change."
tradeoff = "You only test attacks you thought of. Zero successes on your own set means the set is passing, not that the agent is safe."
file = "loopwright/evals/datasets/safety.jsonl"
try = "What is red teaming?"
question = "How do you test that an agent's prompt-injection defences work?"
answer = "Build an attack set: injected instructions in every channel the agent reads, across phrasings and goals, with exfiltration and unauthorised actions as the success conditions. Measure attack success rate, and run it with defences off to confirm the attacks work at all. Use a model that is easy to fool, since defences must hold in the worst case. Keep it in CI, add every new technique found, and state its limits honestly."

# =============================================================== MODELS AND COST

[[concept]]
id = "model-gateway"
term = "Model gateway"
aliases = ["LLM gateway", "provider abstraction", "model router", "provider adapter"]
pillar = "models"
node = "model"
kinds = []
one_liner = "One interface in front of every model provider, with reliability and accounting built in."
explain = "The loop asks the gateway for a completion in a neutral message format. The gateway picks the provider, translates to its wire format, retries, falls back, trips circuit breakers and records usage. Loopwright ships five providers behind it: the offline scripted model, local open-source models, Claude through a Claude Code subscription, the Anthropic API and any OpenAI-compatible endpoint."
why = "Models change every few months. With one seam, swapping a model or adding a provider touches one file, and the same evals judge the result."
tradeoff = "A neutral interface tends to expose only what all providers share. Provider-specific features such as caching controls need deliberate pass-through."
file = "loopwright/models/gateway.py"
try = "What is a model gateway?"
question = "How do you avoid being locked in to one model provider?"
answer = "Put a gateway between the agent and the providers: one internal message and tool format, an adapter per provider. Keep prompts free of provider quirks where possible. Above all keep an eval suite, since portability is only real if I can measure a new model on my own tasks in an afternoon. The gateway is also where retries, fallback, rate limits and cost tracking belong."

[[concept]]
id = "scripted-model"
term = "Scripted model"
aliases = ["mock model", "fake LLM", "test double", "deterministic model", "offline model"]
pillar = "models"
node = "model"
kinds = []
one_liner = "A rule-based stand-in for an LLM, so the harness runs and is tested with no key."
explain = "Loopwright's default provider is not a language model. It is pattern matching that plays the model's part for a fixed set of request shapes, returning tool calls or answers. It is deliberately gullible: it obeys injected instructions unless the harness fenced them, so the safety evals measure the harness's defence, not a model's luck."
why = "Harness tests should be fast, free and identical on every run. A real model makes them slow, costly and flaky, and hides harness bugs behind the model's good behaviour."
tradeoff = "It proves the harness, not the agent. It says nothing about how a real model will reason, so model-dependent quality still needs evals against real models."
file = "loopwright/models/scripted.py"
try = "What can you do?"
question = "How do you test agent infrastructure without calling a real model?"
answer = "With a scripted model: a deterministic stand-in that returns chosen tool calls and replies. It lets me assert that the harness does its part: the gate blocks, retries fire, memory persists, budgets hold, in milliseconds and in CI. I make it adversarial where that matters, such as obeying injections, so the defence is what is being measured. Real-model evals then sit on top for quality."

[[concept]]
id = "hallucination"
term = "Hallucination and grounding"
aliases = ["hallucination", "grounding", "groundedness", "faithfulness", "fabrication", "citations", "making things up", "make things up"]
pillar = "models"
node = "guard_out"
kinds = []
one_liner = "A model stating something false with confidence, and the practice of tying claims to sources to prevent it."
explain = "Models generate plausible text, and when they lack a fact the plausible continuation may be invented. Grounding counters it: give the model the source material, tell it to answer only from that, require citations, and verify them. Loopwright's handbook answers cite the card they came from and the output guard rejects citations to anything not retrieved."
why = "A fluent wrong answer is worse than no answer, because nothing about it looks wrong."
tradeoff = "Strict grounding makes an agent say 'I do not know' more often, which is correct and can frustrate users. Citations also only show that a source was retrieved, not that the claim follows from it."
file = "loopwright/guardrails.py"
try = "What is hallucination?"
question = "How do you reduce hallucinations in a customer-facing agent?"
answer = "Ground and verify. Retrieve authoritative content and instruct the model to answer only from it and to say when it cannot. Require citations and check them in code. Use tools for facts and arithmetic instead of recall. Make 'I do not know, here is who can help' an acceptable outcome. Then measure faithfulness on a labelled set, because you cannot manage it by reading a few transcripts."

[[concept]]
id = "customisation-options"
term = "Prompting vs RAG vs fine-tuning"
aliases = ["fine-tuning", "fine tuning", "RAG vs fine-tuning", "model customisation", "few-shot"]
pillar = "models"
node = "model"
kinds = []
one_liner = "Three ways to adapt a model: tell it, show it your data at run time, or change its weights."
explain = "Prompting changes instructions and examples: instant and cheap. RAG supplies knowledge at run time: best when the gap is information, especially information that changes. Fine-tuning changes the model itself: best for a consistent style, format or narrow skill at high volume, and poor for facts that change. They combine, and the order to try them is the order listed."
why = "Picking the wrong lever wastes weeks. Most 'we need to fine-tune' problems are missing context."
tradeoff = "Fine-tuning brings data preparation, retraining on every base-model upgrade and harder debugging. RAG brings a retrieval system to maintain. Prompts are limited by the window and by what the model can do with instructions alone."
file = "loopwright/memory/kb.py"
try = "What is the difference between RAG and fine-tuning?"
question = "A customer says they want to fine-tune a model on their documents. What do you tell them?"
answer = "I ask what problem they are solving. If the model needs to know what is in their documents, that is a knowledge gap and RAG fits: it stays current, cites sources and needs no training. Fine-tuning suits behaviour: a house style, a strict format, a narrow classification at scale. I would start with prompting and retrieval, build an eval, and consider fine-tuning only if a measured gap remains that context cannot close."

# =============================================================== MORE TOOLS

[[concept]]
id = "web-search"
term = "Web search"
aliases = ["search tool", "search grounding", "browsing", "live data", "internet access"]
pillar = "tools"
node = "tools"
kinds = ["web.search"]
one_liner = "A tool that fetches current information from the open web, and the least trustworthy input an agent reads."
explain = "A model knows nothing after its training cutoff. A search tool returns titles, URLs and snippets for a query, and the agent answers from them and cites the URLs. Loopwright has five interchangeable backends behind one function: Tavily, Brave, Claude Code's own search, keyless DuckDuckGo, and an offline demo corpus so lessons and evals are repeatable."
why = "Without it the agent answers questions about recent events from stale memory, confidently."
tradeoff = "Anyone can publish a page, so search results are attacker-controlled text. Every result is fenced as untrusted and the turn is tainted: after a search, tools with outside effects are locked until the next turn. Search also adds latency and, with most providers, cost per query."
file = "loopwright/tools/web_search.py"
try = "Search the web for agent evaluation best practices"
question = "You are adding web search to an agent that can also send email. What changes?"
answer = "The threat model. Search results are untrusted input, so the agent now has the lethal trifecta if it also holds private data. I fence results as data, track taint, and block or require approval for outbound actions in any turn that read the web. I cite URLs so answers are checkable, cap result size to protect the context, and add poisoned-result cases to the red-team eval."

[[concept]]
id = "mcp-client"
term = "MCP client"
aliases = ["connecting MCP servers", "third-party tools", "tool marketplace", "connectors"]
pillar = "tools"
node = "tools"
kinds = []
one_liner = "The agent side of MCP: start a server, list its tools, and add them to your own registry."
explain = "Loopwright reads ~/.loopwright/mcp.json, starts each listed server, asks for its tools and exposes them to the model as server__tool. It is the mirror image of the MCP server in this repo, and the test suite connects the two to each other."
why = "It is how an agent gains capabilities nobody on your team wrote: file systems, issue trackers, databases."
tradeoff = "You did not write that server. Its tool descriptions go into your prompt and its results into your context, so both are untrusted. Here borrowed tools need approval by default and their output is fenced. Every extra tool also costs tokens on every call."
file = "loopwright/tools/mcp_client.py"
try = "What is an MCP client?"
question = "What are the risks of connecting a third-party MCP server to your agent?"
answer = "Three. Its tool descriptions are prompt text written by a stranger, so they can carry injected instructions. Its results are untrusted content. And its tools may have side effects I cannot audit. So I connect only servers I trust, pin versions, treat outputs as untrusted, require approval for anything with effects, scope credentials tightly, and watch the token cost of the added tool definitions."

[[concept]]
id = "forgetting"
term = "Forgetting"
aliases = ["memory deletion", "memory hygiene", "memory decay", "right to be forgotten", "stale memory"]
pillar = "memory"
node = "semantic"
kinds = ["memory.forget"]
one_liner = "Removing what the agent should no longer hold: on request, when superseded, or with age."
explain = "A memory store needs a delete path as much as a write path. Loopwright has three: the forget tool when the user asks in chat, a Forget button on every fact in the cockpit, and supersession when a newer value replaces an older one. Each fact also records how often and how recently it was used, which is the signal a decay policy would act on."
why = "A user who cannot correct or delete a memory cannot trust it, and stale facts quietly degrade answers."
tradeoff = "Delete too eagerly and the agent forgets what mattered; never delete and retrieval fills with noise. Deletion also has to reach every copy: indexes, caches, summaries and traces."
file = "loopwright/tools/builtin.py"
try = "Forget that Alex prefers morning meetings"
question = "A user asks your assistant to forget something. What has to happen?"
answer = "The fact is deleted from the memory store and from anything derived from it: vector indexes, summaries that mention it, cached context. I confirm truthfully what was removed. Traces and logs need a retention and redaction policy since they hold the original text. And the write path must not simply re-learn it from the conversation where the user asked for it to be forgotten."

# =============================================================== EXPLAINED, NOT BUILT HERE
# These cards have `runs = false`: the idea is explained and placed on the
# board, but this repository does not implement it. The cockpit labels them.

[[concept]]
id = "streaming"
term = "Streaming"
aliases = ["token streaming", "time to first token", "TTFT", "server-sent events", "SSE"]
pillar = "models"
node = "reply"
kinds = []
runs = false
one_liner = "Sending the reply as it is generated instead of waiting for all of it."
explain = "Model APIs can emit tokens as they are produced. Forwarding them to the user cuts perceived latency from the full generation time to the time to first token. Loopwright streams events (each step as it happens, over Server-Sent Events) but returns each model response whole."
why = "A ten-second wait with nothing on screen feels broken; the same ten seconds with text appearing feels fast."
tradeoff = "You cannot run an output guardrail on text you have already shown. Streaming forces a choice: check in chunks, delay slightly behind the stream, or accept that a violation may be visible before it is caught."
file = "loopwright/server.py"
try = "What is streaming?"
question = "How do you apply output guardrails to a streaming response?"
answer = "You cannot fully check what is already on screen, so pick a tradeoff: buffer a sentence or two and check before release, run a fast checker in parallel and cut the stream on a hit, or stream only low-risk content and hold structured or sensitive answers until complete. I choose by risk, and keep the full post-hoc check for logging and evals either way."

[[concept]]
id = "workflow-graph"
term = "Workflow graphs"
aliases = ["DAG", "state machine", "graph orchestration", "LangGraph", "deterministic workflow"]
pillar = "loop"
node = "workflow"
kinds = ["workflow.node", "workflow.end"]
one_liner = "Control flow drawn as a graph of steps in code, with the model filling in individual nodes."
explain = "In a graph, the programmer fixes which step follows which, including branches, parallel fan-out and joins. Each node may call a model or a tool, but the path is not the model's choice. Loopwright's engine reads a graph from a TOML file with four kinds of node: tool (a direct call, no model), model (one call, fixed prompt), agent (a bounded loop) and route (pick a branch). Nodes whose inputs are ready run in the same round, in parallel. Every tool node still passes through the tool gate, so a workflow cannot do what an agent would be refused."
why = "Predictability. A graph can be tested node by node, audited, and costed in advance."
tradeoff = "It only handles the paths you drew. Every new situation is a code change, where a loop might have adapted."
file = "loopwright/workflows.py"
try = "/workflow morning-brief"
question = "Loop or graph: how do you decide?"
answer = "By how much of the path I know in advance. Known steps, compliance needs or strict cost limits point to a graph. Open-ended tasks where the next step depends on what was found point to a loop. Most real systems mix them: a graph for the skeleton, with an agent loop in the nodes that need judgement, bounded by budgets."

[[concept]]
id = "scheduled-agents"
term = "Scheduled and proactive agents"
aliases = ["cron agents", "background agents", "triggers", "ambient agents", "event-driven agents", "heartbeat", "cron", "scheduled tasks"]
pillar = "harness"
node = "scheduler"
kinds = ["schedule.fire"]
one_liner = "Agents that start from a timer or an event instead of a person's message."
explain = "A trigger (a schedule, a webhook, a new email) starts a turn with a stored prompt and nobody watching. The harness is the same; the door is a clock. Loopwright stores tasks in its database with schedules like 'weekdays 08:00', 'every 30m' or five-field cron. When one is due the scheduler runs an ordinary turn with the approval policy forced to deny, so tools with outside effects are refused in code. A due task is claimed with a compare-and-set, so two running processes cannot both run it. The result goes back to the chat it was created from, and to the Automations page."
why = "Much useful work is periodic or reactive: a morning brief, triage of new tickets, a nightly report."
tradeoff = "No human is present to approve or notice. Unattended agents need stricter permissions, hard budgets, idempotent actions, alerting, and a way to deliver results that someone will actually read."
file = "loopwright/scheduler.py"
try = "Every weekday at 8am, tell me what's on my calendar"
question = "What changes when an agent runs unattended on a schedule?"
answer = "Everything that relied on a person. Approvals become policy: deny, or pre-authorised narrow actions. Budgets and timeouts are mandatory because nobody will press stop. Actions must be idempotent since schedulers retry. Failures need alerts, not a message in an empty chat. And each run starts cold, so the stored prompt has to be complete in itself."

[[concept]]
id = "code-sandbox"
term = "Code execution sandbox"
aliases = ["code interpreter", "shell tool", "run_command", "container isolation", "computer use"]
pillar = "safety"
node = "tools"
kinds = ["shell.run"]
one_liner = "An isolated environment where an agent may run code or commands it wrote."
explain = "Giving a model a shell or a Python interpreter is the most powerful tool there is and the most dangerous. A sandbox runs it somewhere it can do little harm: no credentials, a confined file system, capped time, no network or an allowlist. Loopwright's run_command ships switched off. Switched on, every command needs a human's approval, is denied in a turn that read untrusted content, and runs in the workspace folder with a scrubbed environment and a time limit, inside the operating system's sandbox when there is one (sandbox-exec on macOS, bubblewrap on Linux). The step says which isolation actually applied, including 'none'. There is no list of forbidden commands: string denylists are trivial to walk around."
why = "Arbitrary code can do anything the process can. Isolation is what makes that acceptable."
tradeoff = "Sandboxes add latency and operational weight, and a sandbox with the network open or secrets mounted is theatre."
file = "loopwright/tools/shell.py"
try = "run `ls -la`"
question = "A customer wants the agent to run shell commands on their servers. What do you need in place?"
answer = "Isolation first: a container or VM per session, no ambient credentials, read-only mounts except a scratch area, resource and time limits, egress allowlist. Then authorisation: an allowlist of commands or approval for anything destructive, with dry-run where possible. Then audit: every command and output logged. I would start read-only and widen with evidence."

[[concept]]
id = "agent-auth"
term = "Agent identity and authorisation"
aliases = ["on-behalf-of", "OAuth scopes", "multi-tenancy", "tenant isolation", "service account", "delegated access"]
pillar = "safety"
node = "toolgate"
kinds = []
runs = false
one_liner = "Whose permissions an agent acts with, and how one user's data is kept from another's."
explain = "An agent should act with the requesting user's permissions, not a broad service account: delegated tokens, narrow scopes, short lifetimes. In a multi-user system every memory, trace and retrieval must be filtered by tenant in the data layer, before anything reaches the model. Loopwright is single-user and local, so this is the main thing to add before putting it on a server."
why = "The classic failure is the confused deputy: an agent with wide access retrieves something for a user who was never allowed to see it."
tradeoff = "Per-user credentials and per-request filtering add real engineering and latency. Skipping them trades that for a data leak."
file = "loopwright/toolgate.py"
try = "What is agent authorisation?"
question = "How do you make sure an internal assistant never shows a user a document they cannot access?"
answer = "Enforce it in retrieval, not in the prompt. The search runs with the user's identity and filters on the source system's permissions at query time, so forbidden documents never enter the context. Tools call downstream systems with the user's delegated token. I test it with users who should and should not see specific documents, and that test must pass every time."

[[concept]]
id = "rollout"
term = "Shadow, canary and versioning"
aliases = ["shadow mode", "canary release", "A/B test", "prompt versioning", "rollback", "staged rollout"]
pillar = "evals"
node = "release"
kinds = []
runs = false
one_liner = "Shipping an agent change to real traffic in stages, with a way back."
explain = "After the offline gate passes, a change still meets inputs no test set contains. Shadow mode runs the new version beside the old and compares without showing users. A canary serves a small share of traffic. Versioning prompt, model and configuration together makes every trace attributable and rollback a single step. Loopwright's gate is the offline half of this."
why = "Offline evals cover what you imagined; production covers everything else."
tradeoff = "Shadowing doubles model spend for the duration and cannot be used for actions with side effects. Canaries need enough traffic to tell signal from noise."
file = "loopwright/evals/gate.py"
try = "What is a canary release?"
question = "You want to upgrade the model behind a production agent. Walk me through it."
answer = "Run the full eval suite on the new model, including the fallback path and the safety set. Fix prompt regressions. Shadow it on sampled traffic and compare quality, cost and latency. Canary to a few percent with automatic rollback on error or guardrail rates. Ramp up. Keep the old version pinned and deployable until the new one has run clean for a while."

[[concept]]
id = "feedback-loop"
term = "Feedback loop"
aliases = ["data flywheel", "error analysis", "continuous improvement", "trace review", "human review"]
pillar = "ops"
node = "release"
kinds = []
one_liner = "Turning production failures into eval cases, and eval results into the next change."
explain = "The cycle is: trace real usage, find failures (through online checks, user signals and reading samples), classify them, add each as an eval case, fix, pass the gate, ship, repeat. The eval set grows from reality instead of imagination. In the cockpit every reply has a thumbs up, a thumbs down and 'Save as eval case': the case is built from that run's own trace and runs with `loopwright eval --mine`. This loop, more than any single technique, is what makes an agent improve."
why = "Without it, teams fix whichever problem was reported most recently and regress the rest."
tradeoff = "It needs sustained human attention: someone has to read traces and label failures. That work does not automate away."
file = "loopwright/evals/mine.py"
try = "What is a feedback loop in LLM-Ops?"
question = "How do you systematically improve an agent after launch?"
answer = "With a loop. Sample traces weekly and read them with the team; that is where the real failure modes show up. Group them, count them, and turn the common ones into eval cases. Fix the biggest category, confirm with the suite, ship behind the gate. Track the metric over time. The discipline is that every fix starts as a failing test."

[[concept]]
id = "determinism"
term = "Non-determinism"
aliases = ["temperature", "sampling", "reproducibility", "seed", "variance"]
pillar = "models"
node = "model"
kinds = []
runs = false
one_liner = "The same prompt can produce different outputs, and an agent multiplies that across every step."
explain = "Models sample from a probability distribution. Lower temperature narrows it but does not make outputs identical across runs, model versions or providers. In an agent each step's variation feeds the next, so whole trajectories diverge. Loopwright's scripted model is deterministic by construction, which is why its evals are exact; evals against a real model need several trials."
why = "It is the reason one passing run proves little and the reason evals report rates."
tradeoff = "Forcing low temperature buys consistency and costs some quality on open-ended work. Variance cannot be removed, only measured and bounded."
file = "loopwright/models/scripted.py"
try = "What is non-determinism in agents?"
question = "A bug report says the agent 'sometimes' does the wrong thing. How do you reproduce it?"
answer = "Start from the trace of a failing run, which shows the exact context at the step that went wrong. Re-run that input many times to estimate how often it fails. Then test hypotheses by changing one thing: the prompt wording, a tool description, the retrieved context. A fix is confirmed by the failure rate dropping over many trials, not by one clean run."

[[concept]]
id = "reasoning"
term = "Reasoning and thinking budgets"
aliases = ["extended thinking", "chain of thought", "reasoning tokens", "think step by step", "effort"]
pillar = "models"
node = "model"
kinds = []
runs = false
one_liner = "Letting the model work through a problem before it answers, at a cost in tokens and time."
explain = "Many models can spend tokens reasoning before producing output, with a budget or effort setting. It helps on multi-step and ambiguous tasks and on choosing between tools. The reasoning is billed and adds latency. Loopwright surfaces a short stated reason per model call when the provider returns one, but sets no thinking budget."
why = "Hard decisions made in one shot are more often wrong."
tradeoff = "More thinking is slower and dearer, and for simple routing steps it buys nothing. Match the budget to the step: high for planning, low for extraction."
file = "loopwright/models/gateway.py"
try = "What are reasoning tokens?"
question = "When would you turn extended reasoning on or off in an agent?"
answer = "On for the steps where the decision is hard and mistakes are expensive: planning, choosing among many tools, resolving conflicting evidence. Off or low for mechanical steps: classification, extraction, formatting. I set it per call type through the gateway and check with evals that the extra cost buys a higher pass rate."

[[concept]]
id = "query-rewriting"
term = "Query rewriting"
aliases = ["query expansion", "HyDE", "multi-query", "query decomposition", "search query generation"]
pillar = "memory"
node = "gate"
kinds = []
runs = false
one_liner = "Turning what the user typed into what the search index needs."
explain = "User messages make poor queries: they lean on the conversation ('what about the second one?'), mix several questions, or use different words from the documents. Rewriting resolves references, splits multi-part questions and adds likely terms before searching. Loopwright does the minimal form: it strips stopwords and, in model-gate mode, lets the small model propose the query."
why = "Retrieval can only find what the query describes. A bad query fails before any ranker runs."
tradeoff = "It adds a model call and can drift from what the user meant. Keep the original query in the mix."
file = "loopwright/memory/gate.py"
try = "What is query rewriting?"
question = "Follow-up questions like 'and what about pricing?' retrieve nothing useful. Why, and what is the fix?"
answer = "The follow-up has no subject; it only makes sense with the conversation. The fix is to rewrite it into a standalone query before searching, using recent history: 'pricing for the Pro plan of product X'. I would do it with a small model, keep the original as a fallback, and add follow-up cases to the retrieval eval."

[[concept]]
id = "semantic-cache"
term = "Response caching"
aliases = ["semantic cache", "result cache", "memoization", "exact-match cache"]
pillar = "models"
node = "cost"
kinds = []
runs = false
one_liner = "Reusing a previous answer for the same or a very similar request."
explain = "Different from prompt caching, which reuses the model's work on a prefix. A response cache stores whole answers keyed by the request, exactly or by embedding similarity, and returns them without calling the model. It suits FAQ-like traffic and expensive deterministic sub-steps. Loopwright has none; its idempotency log is the closest relative, and that exists for safety, not speed."
why = "The cheapest and fastest model call is the one you do not make."
tradeoff = "A similarity match can return an answer to a question that only looks the same. Personalised or time-sensitive answers must not be shared between users or kept too long."
file = "loopwright/toolgate.py"
try = "What is a semantic cache?"
question = "What is the difference between prompt caching and a semantic cache?"
answer = "Prompt caching is on the provider side: it reuses computation for an identical prompt prefix, and the model still generates a fresh answer. A semantic cache is on my side: it returns a stored answer for a similar request and skips the model. The first is safe and always worth structuring for. The second needs care about staleness, personalisation and false matches."

[[concept]]
id = "local-models"
term = "Local models"
aliases = ["open-source models", "on-device inference", "Ollama", "LM Studio", "llama.cpp", "offline", "self-hosted model", "open weights"]
pillar = "models"
node = "model"
kinds = []
one_liner = "Running an open-weights model on your own machine, with no network and no per-token bill."
explain = "Runners such as Ollama, LM Studio and llama.cpp serve a model on localhost behind the same chat API the hosted providers use. Loopwright finds a running server, lists its models and talks to it like any other provider. Tool calling is the weak point: some local models support it natively, some write the call as JSON in their text, and some servers refuse tool requests outright, so the provider degrades through those three cases and remembers which one worked."
why = "Privacy, cost, and working where there is no connection: a flight, an air-gapped site, a customer who will not send data out."
tradeoff = "A small local model is a weaker agent: more wrong tool choices, more lost threads, a short context window, and slow on a laptop. The harness matters more, not less, with a weaker model, because budgets and the tool gate are what contain its mistakes."
file = "loopwright/models/local.py"
try = "What is a local model?"
question = "A customer cannot send data to a hosted model. What changes in your agent design?"
answer = "The model becomes a constraint to design around. I would self-host an open-weights model behind the same gateway interface, then compensate for its weaker reasoning: fewer and simpler tools, more structure in code and less left to the loop, tighter budgets, stricter output validation with repair, and smaller contexts. I would run the same eval suite against it to learn exactly which cases it loses, and keep a human in the loop where it loses them."

[[concept]]
id = "workflow-vs-agent"
term = "Workflow versus agent"
aliases = ["agentic workflow", "orchestration", "deterministic pipeline", "who decides", "autonomy"]
pillar = "loop"
node = "workflow"
kinds = ["workflow.start"]
one_liner = "In a workflow the code decides what happens next; in an agent the model does."
explain = "Both use models and tools. The difference is who holds the control flow. A workflow is a path drawn in advance: the model is called at fixed points to do one bounded job each time. An agent is a loop in which the model chooses every next step from what it has seen so far. Loopwright runs both through the same gateway, tool gate, guardrails and trace, so you can put one question through each and compare the two traces: `/workflow triage: ...` against the same sentence typed normally."
why = "It is the first design decision on any project, and the most common mistake is choosing an agent when the steps were known all along."
tradeoff = "A workflow is cheaper, faster, testable step by step and fails in fewer ways, but handles only the paths someone drew. An agent adapts to inputs nobody anticipated and pays for it in cost, latency and variance."
file = "loopwright/workflows.py"
try = "/workflow triage: buy milk tomorrow"
question = "A client asks for 'an AI agent' to process refund requests. Where do you start?"
answer = "By asking whether the steps are known. Refunds usually are: read the request, look up the order, check policy, decide, reply. That is a workflow with a model in two or three nodes (extract the fields, judge the edge cases, write the reply) and plain code everywhere else. I would only put a loop inside the one node that needs open-ended investigation, with a budget. It will be cheaper, auditable, and each node gets its own eval. I say 'agent' in the pitch and build a workflow."

[[concept]]
id = "standing-instructions"
term = "Standing instructions and persistence"
aliases = ["persistence attack", "scheduled task creation", "delayed injection", "memory poisoning", "self-instruction"]
pillar = "safety"
node = "scheduler"
kinds = ["schedule.create"]
one_liner = "Anything the agent writes for its future self is a way for one bad turn to become every turn."
explain = "A scheduled task is the agent leaving an instruction for a later run that no person will read first. The same is true of a memory, a skill, or a file it will load next time. If text from a web page can get one of those written, the injection outlives the conversation and runs again tomorrow with nobody watching. So Loopwright treats `schedule_task` as an outside effect: a human approves it, and it is denied outright in a turn that has read untrusted content. The task's own runs are then unattended and cannot send, browse or run commands."
why = "Per-turn defences are not enough when the agent can change what future turns start with."
tradeoff = "Approval on every scheduled task is friction for a feature people want to feel effortless, and the stored prompt still deserves review: it runs with whatever the tools allow."
file = "loopwright/scheduler.py"
try = "Every weekday at 8am, tell me what's on my calendar"
question = "Your agent can schedule its own follow-ups. What is the new risk, and how do you bound it?"
answer = "Persistence. An injected instruction that manages to create a task, a memory or a skill is replayed in later runs where no human is present. I bound it at both ends. Creation is a privileged action: approved by a person, refused in any turn that touched untrusted content, and the stored prompt is shown in full. Execution is least-privilege: unattended runs get read and local-write tools only, a hard budget, and their output is delivered somewhere a person will see it. I also list standing instructions in the UI so they can be audited and removed."

[[concept]]
id = "browser-agent"
term = "Browser agent"
aliases = ["computer use", "web agent", "browser automation", "headless browser", "CDP", "Chrome DevTools Protocol"]
pillar = "tools"
node = "subagent"
kinds = ["browser.start", "browser.return"]
one_liner = "A worker that drives a real browser, one action at a time, and reports back."
explain = "Fetching a URL returns HTML. A browser agent runs the page: JavaScript executes, links can be clicked, forms filled in and submitted. In Loopwright the main agent has a single tool, `browse_web(task)`. It starts a headless Chrome and a worker with a fresh context and four tools (open, click, type, read). The worker acts, reads the new page, acts again, and returns a short summary; none of the pages enter the main context. Every request the page makes is intercepted, so it cannot reach localhost or the private network."
why = "A large share of the web only works with interaction, and many business systems have no API at all, only a web page."
tradeoff = "It is the slowest and least reliable tool an agent has: each action is a model call, pages change under it, and everything it reads is untrusted. Use an API or a plain fetch whenever one exists."
file = "loopwright/tools/browser.py"
try = "Use the browser: open demo://site, follow the Pricing link and tell me what the Team plan costs"
question = "When would you give an agent a browser instead of API tools, and what do you put around it?"
answer = "Only when there is no API or the content needs JavaScript or a login flow. Around it: isolation (its own browser profile, no saved sessions unless the task needs them), an egress filter so it cannot be pointed at internal addresses, approval before it starts because submitting a form is an outside effect, a step budget, and treatment of everything it returns as untrusted. I run it as a sub-agent so page content stays out of the main context, and I record a screenshot per step because 'it clicked the wrong button' cannot be debugged from text alone."

[[concept]]
id = "page-snapshot"
term = "Page snapshots and numbered elements"
aliases = ["set-of-marks", "accessibility tree", "DOM snapshot", "element refs", "observation space", "grounding"]
pillar = "tools"
node = "tools"
kinds = ["browser.action"]
one_liner = "Turn a page into text with a number on everything clickable, so a text model can act on it."
explain = "A model cannot click pixels it never sees. After each action the page is reduced to its title, its address, a numbered list of the things that can be clicked or typed into, and the visible text. The model replies with a number: click [2]. This is the same idea as the accessibility tree a screen reader uses, and as set-of-marks prompting, where numbered labels are drawn over a screenshot. The numbers are reassigned on every snapshot, so the model must always use the latest one. Loopwright also saves a screenshot per action, for the person replaying the run, not for the model."
why = "Raw HTML is tens of thousands of tokens of noise. A snapshot is a few hundred tokens that contain exactly what the model can act on."
tradeoff = "Anything not in the snapshot does not exist for the model: canvas apps, drag and drop, hover menus. Vision-based computer use handles those, at many times the cost per step."
file = "loopwright/tools/browser.py"
try = "In the browser, open demo://site and search for offline search"
question = "How does a language model 'click' a button?"
answer = "It never touches the page. The harness observes the page and serialises it into something the model can read, usually a compact list of interactive elements with stable ids taken from the DOM or the accessibility tree, sometimes a screenshot with numbered marks. The model names an element and an action. The harness resolves that id back to the real element, performs the action, waits for the page to settle and produces the next observation. So it is an ordinary observe, act loop; the engineering is in making the observation small, faithful and re-derived after every step."

[[concept]]
id = "messaging-gateways"
term = "Messaging gateways"
aliases = ["Telegram bot", "Discord bot", "Slack app", "WhatsApp", "channels", "chat integration", "webhook", "long polling", "Socket Mode"]
pillar = "harness"
node = "gateway"
kinds = []
one_liner = "Adapters that let the same agent be reached from the chat apps people already use."
explain = "Each channel delivers messages differently. Telegram is long polling: ask for updates and let the request hang. Discord and Slack push events over a WebSocket you open. WhatsApp calls a webhook you host, signed so you can check it came from Meta. Loopwright hides those differences behind one small bridge that supplies what every chat channel needs: an allowlist of who may talk to the agent, one session per chat, approvals asked in words ('reply yes'), a /steps command to see what the agent did, and delivery of scheduled-task results back to the chat."
why = "An assistant is used where its user already is. Nobody opens a separate app to ask one question."
tradeoff = "A bot on a public platform can be found by anyone, messages pass through a third party, there is no rich UI for approvals, and a webhook is a public endpoint that must verify every request."
file = "loopwright/gateways/chat.py"
try = "What is a gateway?"
question = "You are asked to put the agent in Slack. What changes besides the transport?"
answer = "Identity and trust first: map the Slack user to a principal and an allowlist or tenant, because the bot is reachable by everyone in the workspace. Sessions: one conversation per thread or DM. Approvals: there is no modal by default, so either interactive buttons or an explicit yes/no reply with a timeout that fails closed. Delivery: acknowledge the event within three seconds and answer asynchronously, since a turn takes longer. Formatting and length limits. And nothing changes in the harness: guardrails, tool gate and tracing are the same, which is the reason to keep channels as thin adapters."

[[concept]]
id = "model-comparison"
term = "Model comparison"
aliases = ["model selection", "bake-off", "model evaluation", "which model", "benchmarking models", "model routing by task"]
pillar = "evals"
node = "evals"
kinds = []
one_liner = "Run your own tasks through each candidate model and compare behaviour, time and cost."
explain = "Public leaderboards measure someone else's tasks. Choosing a model for a product means running that product's cases through each candidate, in the same harness, and reading four things: how many pass, how long they take, what they cost, and how often the harness had to help (retries, repaired tool calls). `loopwright compare` runs eight behaviour cases through any set of providers and models, or through one model under different settings, and keeps every trace so a failure on one model can be replayed next to a pass on another."
why = "Model choice is the largest single lever on cost and latency, and the right answer changes every few months."
tradeoff = "Eight cases is a smoke test, not a verdict. A real comparison needs your own cases, several trials per case because models are not deterministic, and a look at the failures rather than only the score."
file = "loopwright/evals/compare.py"
try = "What is model comparison?"
question = "A customer asks which model they should use. How do you answer?"
answer = "With their data, not an opinion. I collect twenty to fifty real tasks with a definition of success for each, run every candidate through the same harness with several trials, and report pass rate, latency percentiles and cost per successful task. Then I read the failures, because two models with the same score fail differently. The recommendation is usually a routing policy rather than one model: the cheapest model that passes handles the bulk, with escalation to a stronger one for the cases it fails, and the comparison becomes a regression suite that reruns when a new model ships."

[[concept]]
id = "opentelemetry"
term = "OpenTelemetry for agents"
aliases = ["OTel", "OTLP", "GenAI semantic conventions", "spans", "Langfuse", "Phoenix", "LangSmith", "observability backend"]
pillar = "ops"
node = "trace"
kinds = []
one_liner = "The standard wire format for traces, with agreed names for model calls and tool calls."
explain = "OpenTelemetry describes work as spans: named intervals with a parent, a duration and attributes. Its GenAI conventions fix the attribute names, such as gen_ai.request.model and gen_ai.usage.input_tokens, so any backend can tell which span was a model call and what it cost. Loopwright keeps its own JSONL trace and converts on export: the turn becomes a root span, each model call and tool call a child span, and every other step an event on the root. `loopwright export last --otlp <url>` sends one turn to any OTLP collector; setting OTEL_EXPORTER_OTLP_ENDPOINT sends every turn as it finishes."
why = "Teams already have a tracing backend. An agent whose traces land in the same place as the rest of the system gets debugged; one with its own private format gets ignored."
tradeoff = "Prompts and tool results in spans are sensitive data leaving the process, the conventions are still changing, and a generic span view shows less than a purpose-built one."
file = "loopwright/otel.py"
try = "What is OpenTelemetry for agents?"
question = "How would you get this agent's traces into the customer's existing observability stack?"
answer = "Export OpenTelemetry. One trace per turn, a span per model call and per tool call with the GenAI attribute names for model, token counts and tool name, and the session id so turns can be grouped. I would send it through their collector over OTLP so sampling, redaction and routing follow their existing policy, decide explicitly whether prompt and response bodies are captured, and keep the trace id in our own logs and user-facing error messages so support can go from a complaint to the exact trace."
