[[exercise]]
id = "stuck"
title = "Find the bug from a trace"
level = 2
minutes = 15
concepts = ["stop-conditions", "tracing", "replay"]
file = "loopwright/loop.py"
brief = """
A user reports: "I asked it to compare two phone plans and it gave up, saying it was stuck."

The trace of that turn shows three tool calls and then the stop:

    tool.run   web_search   {"query": "Total Wireless unlimited plan price"}
    tool.run   web_search   {"query": "Visible plus plan price"}
    tool.run   web_search   {"query": "Total Wireless vs Visible coverage"}
    loop.stop  stuck: the same call was repeated 3 times

Those are three different searches. The agent was working, and the repeat detector stopped it.

The detector is below. It is meant to return True only when the last `window` calls are the same call repeated: the same tool with the same arguments. Find the bug and fix it. Keep the behaviour it gets right: a real repeat must still be caught.
"""
interview = "A customer says the agent is broken; how do you find out why? Open the trace before the code. Read what the agent actually did, find the first step that is wrong, and only then look at the code that produced it. Then turn the trace into a test so it cannot come back."
hints = [
  "Read what `recent` is compared on. Which part of a call does the set contain?",
  "Two calls are the same when the name and the arguments both match.",
  "Dictionaries cannot go in a set. Compare with a key such as (c[\"name\"], json.dumps(c[\"args\"], sort_keys=True)), or compare each call to the first with ==.",
]
debrief = "You debugged from the trace, which is the habit this whole project exists to build. Loopwright's own repeat detection compares the tool and its arguments, and some tools are marked repeatable because calling them twice is normal. Every eval case in the reliability suite started as a failure like this one."
starter = '''
def is_stuck(calls, window=3):
    """True when the last `window` tool calls are the same call repeated.

    calls: [{"name": str, "args": dict}, ...], oldest first
    """
    recent = calls[-window:]
    return len(recent) == window and len({call["name"] for call in recent}) == 1
'''
solution = '''
def is_stuck(calls, window=3):
    """True when the last `window` tool calls are the same call repeated.

    calls: [{"name": str, "args": dict}, ...], oldest first
    """
    recent = calls[-window:]
    if len(recent) < window:
        return False
    first = recent[0]
    return all(call["name"] == first["name"] and call["args"] == first["args"] for call in recent)
'''
