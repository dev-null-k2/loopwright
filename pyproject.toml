[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loopwright"
version = "0.2.1"
description = "An AI agent you can watch work: every step lights up on the architecture and can be replayed."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Karthik Kasukurti" }]
keywords = ["ai-agents", "agent-harness", "llm", "evals", "mcp", "rag", "observability", "claude-code"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []          # the standard library only, on purpose

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
loopwright = "loopwright.cli:main"

[project.urls]
Homepage = "https://github.com/dev-null-k2/loopwright"
Demo = "https://dev-null-k2.github.io/loopwright/"

[tool.setuptools.packages.find]
include = ["loopwright*"]

[tool.setuptools.package-data]
loopwright = ["web/*", "web/js/*", "web/fonts/*", "learn/*.toml", "skills/*/SKILL.md", "kb/*.md",
              "fixtures/*", "fixtures/site/*", "flows/*.toml", "evals/datasets/*.jsonl"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E701", "E731", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
